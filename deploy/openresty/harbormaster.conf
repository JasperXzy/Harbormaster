# Dedicated vhost for the existing 1Panel OpenResty container (host network).
# In that container /www is mounted from /opt/1panel/www on main-server.
# Configure DNS and certificate files before enabling this file.
server {
    listen 80;
    listen [::]:80;
    server_name harbor.jasperxzy.com;
    location ^~ /.well-known/acme-challenge/ {
        root /www/harbormaster-acme;
        try_files $uri =404;
    }
    location / {
        return 301 https://harbor.jasperxzy.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name harbor.jasperxzy.com;
    ssl_certificate /www/harbormaster-tls/fullchain.pem;
    ssl_certificate_key /www/harbormaster-tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /www/harbormaster-web;
    index index.html;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;

    # Agent endpoints use token auth; panel mutations use session + Origin/CSRF.
    # This location also permits SSE and serves the static agent releases.
    location ~ ^/(api|agent)(/|$)|^/(healthz|readyz)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 90s;
    }
    location /assets/ {
        try_files $uri =404;
    }
    location = /index.html {
        expires -1;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
