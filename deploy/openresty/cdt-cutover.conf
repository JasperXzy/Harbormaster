# Replace only the existing cdt.jasperxzy.com vhost after backing it up.
# Reuse its 1Panel-managed certificate, log paths and ACME webroot.
server {
    listen 80;
    listen 443 ssl;
    server_name cdt.jasperxzy.com;
    http2 on;
    access_log /www/sites/cdt.jasperxzy.com/log/access.log main;
    error_log /www/sites/cdt.jasperxzy.com/log/error.log;
    ssl_certificate /www/sites/cdt.jasperxzy.com/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/cdt.jasperxzy.com/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    error_page 497 https://$host$request_uri;
    if ($scheme = http) { return 301 https://$host$request_uri; }

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }
    location ~ /\. {
        return 404;
    }

    root /www/harbormaster-web;
    index index.html;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;

    location ~ ^/(api|agent)(/|$)|^/(healthz|readyz)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 90s;
        add_header Cache-Control no-store always;
        add_header Cloudflare-CDN-Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ^~ /assets/ {
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control no-store always;
        add_header Cloudflare-CDN-Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
