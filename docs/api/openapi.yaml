        注册绑定当前管理员会话；登录绑定 Secure/HttpOnly/SameSite=Strict 的 hm_passkey cookie，
        同一浏览器再次开始登录会替换绑定 cookie。登录开始与完成各计入已有登录限速。
        注册要求 discoverable credential 和 userVerification=required；不允许跨源 iframe。
        503 passkey_unavailable 表示 HTTPS public_url 未配置；401 invalid_passkey 表示挑战或凭据无效。
      security: []
