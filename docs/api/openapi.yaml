  /events:
    get:
      tags: [system]
      operationId: streamEvents
      summary: 事件流（SSE）
      description: |
        `text/event-stream`。每条消息的 `event:` 是事件名，`data:` 是一行 JSON：

        | 事件名 | data 的结构 | 触发时机 |
        |---|---|---|
        | `quota.updated` | `QuotaStatus` | 某账号某范围的实时估算或官方值变化 |
        | `instance.realtime` | `InstanceRealtimeEvent` | agent 上报后该实例的最新公网速率 |
        | `agent.status` | `AgentStatusEvent` | agent 上线、掉线、注册、被撤销 |
        | `job.updated` | `Job` | 任务状态变化 |
        | `notification.created` | `Notification` | 产生了一条新通知 |
        | `notification.updated` | `Notification` | 已有通知的发送或取消状态变化；按 id 更新，不当作新告警 |
        | `ping` | `{}` | 心跳 |

        断线后前端自动重连，重连成功后重新拉取当前页面的数据。
      responses:
        "200":
          description: 事件流
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

