        from_at: {type: string, format: date-time}
        until_at: {type: string, format: date-time}
        observed_from: {type: string, format: date-time, nullable: true}
        observed_until: {type: string, format: date-time, nullable: true, description: First/last observations do not assert continuity between them.}
