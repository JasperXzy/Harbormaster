        estimated_accounts: {type: integer, minimum: 0}
        forecast_accounts: {type: integer, minimum: 0}
        known_official_bytes: {type: integer, format: int64, minimum: 0}
        known_estimated_bytes: {type: integer, format: int64, minimum: 0}
        known_forecast_bytes: {type: integer, format: int64, minimum: 0}
        forecast_sample_days_min: {type: integer, minimum: 0}
        forecast_sample_days_max: {type: integer, minimum: 0}
        forecast_exceeding_accounts: {type: integer, minimum: 0}

    DailyScope:
      type: object
      required: [bytes, known_bytes, has_data, source, status, is_complete_day, from_at, until_at, observed_from, observed_until, reasons]
      properties:
        bytes: {type: integer, format: int64, nullable: true, description: Full requested window only; null when coverage is incomplete.}
        known_bytes: {type: integer, format: int64, minimum: 0}
        has_data: {type: boolean, description: Distinguishes measured zero from no observations.}
        source: {type: string, enum: [official, agent_estimate, mixed, unavailable]}
        status: {type: string, enum: [complete, partial, unavailable, pending]}
