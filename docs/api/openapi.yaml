# Harbormaster 面板接口契约（面板 <-> hm-server）
#
# 状态：M1 草稿，待后端评审，尚未冻结。
# 范围：PRD v0.5 第 12 节 M1 的页面——安装向导、登录、总览、实例、流量、通知、设置、agent 安装引导。
# 不在本文件内：hm-agent 与 hm-server 之间的上报协议、数据库结构（见 WORK_SPLIT 第 2 节）。
#
# ── 变更记录 ────────────────────────────────────────────────────────────────
# 2026-11-13  Duplex traces: add atomic paired agent trace submissions, saved endpoint/address evidence, detail and text export. User confirmed both-or-neither enqueue with independent execution and actual timestamps thereafter. Both managed instances need fresh unique public addresses and authenticated trace capability at submission; queued legs recheck endpoint address evidence, running legs retain their original measurements. Trace history adds nullable duplex_id/direction backlinks. Reads never probe or refresh cloud data; no claim of synchronized packets or a symmetric path.
# 2026-11-13  Trace snapshots: add per-probe-plan daily trace schedules and bounded snapshot history/comparisons. User chose business-timezone 03:00 default, no historical backfill, one current catch-up; compare only complete reached paths with unchanged target IP and unique complete per-TTL ASN evidence, coalescing adjacent ASNs. Different ASN database versions establish a new starting point without an alert. Add optional non-urgent network_route_change event records; Telegram delivery remains separate.
# 2026-11-13  Trace enrichment: persist background offline ASN/geolocation, bounded public-only PTR, per-TTL response statistics and evidence-based network labels separately from immutable agent reports. Detail/export read frozen results and dataset attribution; history adds enrichment_status only. Missing responses/ASN remain unknown; CN2 tier, Alibaba cross-border status and detour stay unconfirmed. Restored unfinished enrichment is cancelled with old work.
# 2026-11-13  Offline IP database: add cached /network/ipdb status with source attribution, dataset versions/sizes and process memory evidence. User chose bundled ASN+country, optional city. Updates fetch monthly public DB-IP files in the background; record lookups stay offline. User approved an evidence-only label policy for the next trace integration: CN2 GIA/GT and Alibaba cross-border status stay unconfirmed; estimated geolocation does not prove detour.
# 2026-11-13  Trace panel: add async POST /network/traces, bounded summary history, detail and text export. Submission snapshots point/target/request, checks source trace polling separately from ordinary probes and rechecks queued managed targets. GET reads stored data only; no synchronous DNS/cloud/probing. Per-hop absence is unknown, TCP reset means reached but closed. Demo reads are synthetic.
# 2026-11-13  Trace queue: network_probe also covers fixed traceroute tasks. Private agent claim/result endpoints keep trace payloads separate from ordinary probes; old agents cannot claim traces. Shared point leases and expiry prevent overlap/replay. Job.result stays null; no panel trace submission/history route is introduced in this phase.
# 2026-11-12  Network alerts: add network_latency, network_loss and network_unreachable. PRD defaults remain sampled latency > configured limit for 600s, failed probes >5%, and 3 consecutive completely failed runs. User confirmed recovery after 3 valid healthy runs; gaps/skips/local failures reset streaks without recovery. New results drive transitions once, with per-plan overrides and probe_plan_id on notifications. Delivery remains separate.
# 2026-11-12  Network management: add cached points, editable public/custom or managed-instance targets, revisioned probe plans and run history. Follow the unique public IP of the selected family; incomplete/stale/ambiguous discovery skips a run. Missed periods are not replayed: schedule one current run and advance from now. Mutations perform no synchronous DNS/cloud/probes; demo remains read-only.
# 2026-11-12  Agent probe queue: reserve network_probe job type for persisted fixed ICMP/TCP tasks. Agent claim/result protocol is private; job result remains null in this queue phase. No panel submission route yet. Expired executions are terminal and never replayed.
# 2026-11-12  Instance finance: add cached current-month DescribeInstanceBill rows matched by exact instance ID and product family. Preserve bill type/currency and payable/after-discount decimal strings; empty matches do not mean zero cost. No shared-resource allocation, refund netting or amortization. RAM drafts add bssapi:DescribeInstanceBill.
# 2026-11-12  Quiet hours/maintenance: user confirmed record-only, no catch-up for non-urgent alerts. Add business-timezone daily settings and UTC maintenance window, persistent notification urgency/suppression metadata, enqueue/claim/pre-send gates. Urgent quota/agent events and explicit tests bypass; already authorized requests cannot be recalled.
# 2026-11-12  External heartbeat: add encrypted write-only URL settings and async heartbeat_test jobs. User-approved success gate requires local HTTP readiness/SQLite and recent collection scheduler progress. No old pings are replayed; settings reads omit URL because its path/query may contain credentials.
# 2026-11-12  Password login policy: PATCH /session/password changes future password authentication only, with session+CSRF. Disabling requires a registered Passkey for the current RP; deleting its last eligible key is refused while disabled. User-approved CLI reset enables password login, clears sessions/challenges and retains Passkeys.
# 2026-11-12  Agent quality correction: delayed reports no longer overwrite a detected backward clock jump with stale. History independently checks current and previous sample order, including legacy records.
# 2026-11-12  Agent network history: add raw cumulative samples with nullable same-epoch interval deltas and monotonic-duration average rates. Preserve receipt quality, gaps and unavailable reasons; never bridge epochs or prorate a boundary-crossing interval into hourly/range totals.
# 2026-11-12  Cloud network history: persist complete provider minute samples and expose GET /instances/{instance_id}/cloud-network-history with explicit <=7-day range and chronological keyset pagination. Gaps are missing observations, never zero; no byte integration or agent/cloud blending.
# 2026-11-12  SWAS runtime validation: use the ISO StartTime/EndTime format already verified by M0 for CPU and network reads; live production-path samples now succeed. No CPU schema change or claim that all timestamp formats fail.
# 2026-11-12  Cloud public network rates: Instance.cloud_network exposes cached 60s Average ingress/egress bit/s streams, distinguishing classic ECS, VPC per-IP and SWAS sources. Topology or query failures preserve stale observations; no instance total, byte integral, agent replacement or CDT protection is inferred.
# 2026-11-12  Passkey registration/login: add session methods, discoverable login options/finish, authenticated registration options/finish and list/delete. JSON uses WebAuthn base64url options/results; five-minute single-use ceremonies are browser/session-bound. UV is required; private keys never leave authenticators. Password disabling and recovery policy remain a separate phase.
# 2026-11-12  System event records: GET /system-events adds cached provider events, stable first-seen pagination and source health. Independent read polling defaults to 60s. Complete empty scans only mark old records not seen; failures retain records and last success, never imply resolution. Provider lifecycle is preserved; no notification delivery or cloud action is added.
# 2026-11-12  System event source preparation: RAM drafts add ecs:DescribeInstanceHistoryEvents and cms:DescribeSystemEventAttribute as read-only actions. Typed source readers preserve provider lifecycle semantics and distinguish ECS history from CMS interruption signals; no system-event panel route or notification dispatch is enabled by this change.
# 2026-11-12  SWAS CPU: Instance.cpu also supports swas_describe_monitor_data / CPU_UTILIZATION with percent samples; namespace and credit_balance are null for SWAS. Preserve the same stale/unknown and timestamp behavior. RAM drafts add the read-only swas-open:DescribeMonitorData action, and runtime limitation text reflects explicit power enablement.
# 2026-11-12  ECS CPU snapshots: optional Instance.cpu exposes CMS CPUUtilization (%) and TotalCredit (absolute count), sampled at 60 seconds. Background inventory queries only; failed/empty sources retain older values as stale, and reads age samples after ten minutes. Unknown remains null, never zero. SWAS CPU remains null pending source verification; no CPU-credit percentage alert or traffic protection is enabled.
# 2026-11-12  API Key control: isolated /integrations/instances/{instance_id}/power and /integrations/jobs/{job_id} use Authorization Bearer plus instance:control, never cookie fallback. Keep HTTPS/host/admin-CIDR checks; Origin/CSRF are not required for explicit bearer credentials. Keys can query only their own power jobs. Idempotency is namespaced by key/panel, and active jobs do not merge across principals. Revocation cancels pre-dispatch jobs atomically while retaining intent; dispatched work keeps its evidence and is never replayed.
# 2026-11-12  Manual power API: POST /instances/{instance_id}/power requires session+CSRF, a durable Idempotency-Key and explicit ECS stop mode. Returns 202 after local enqueue, never synchronously calls the cloud. Disabled by default via instance_power_enabled; SystemInfo exposes that capability. Instance desired_state/desired_state_updated_at are nullable until recorded intent exists, never inferred from cloud status or the legacy stopped default. Demo remains read-only.
# 2026-11-12  Power confirmation: PowerJobResult adds nullable baseline/observation and confirmation_basis. Acceptance stays running until fresh targeted observations confirm the requested state/mode; reboot needs a newer start time or an observed transition. Timeouts and stop-mode fallback fail explicitly without replay. Execution remains separate from the production submission endpoint.
# 2026-11-12  Power task storage: reserve job type instance_power and its persisted request/outcome result. Enqueue saves desired state atomically; durable action event keys retain deduplication after completion and restore; identical active requests reuse a job and conflicting active requests are rejected. A dispatch marker prevents replay after a crash; API acceptance is not observed completion. No power submission endpoint is exposed in this storage phase.
# 2026-11-12  Job history: GET /jobs adds stable cursor pagination and account/instance/type/status/trigger filters. Job now exposes account_ids, nullable instance_id and recorded trigger (panel/cli/schedule/system/unknown; api/telegram reserved for their consumers). Historical source is unknown; current collection/test jobs have no instance target. Reads never enqueue work or call cloud APIs.
# 2026-11-12  Low balance alerts: add balance_low with per-account balance_thresholds (account_id, currency, amount), initially empty. Compare freshly fetched available_amount using exact decimal arithmetic and strict '<'; no currency conversion or stale-cache evaluation. Failed/mismatched sources preserve unknown state. Removing a target or changing its currency cancels the previous condition without a fake recovery; dispatch remains separate.
# 2026-11-12  Encrypted backup download: POST /backups accepts a write-only backup_password via session+CSRF and returns a complete password-encrypted binary attachment. Prepare before sending success headers, with bounded concurrency and session revalidation. No cloud I/O. Restore is an offline CLI into a new directory; user approved cancelling unfinished work and pending notifications, clearing leases and login sessions.
# 2026-11-12  RAM policy drafts: GET /ram-policies returns readonly, instance_power and resource_management documents for copying, with cloud-write flags and explicit verification limitations. These are policy text only, never grants or permission-test results. CDT action, account/resource narrowing and creation dependencies remain unverified; write policies do not enable runtime cloud operations.
# 2026-11-12  Public IP change alerts: add instance_public_ip_changed (empty params, non-urgent, enabled by default). Each new public_ipv4_changed instance event records one notification in the same transaction. First discovery, unknown/incomplete sources, IPv6 allocation-only changes and unchanged rescans do not notify. This is an event notification with no recovery incident; Telegram dispatch remains unwired.
# 2026-11-12  Instance change history: GET /instance-events lists persisted discovery, disappearance/reappearance, status and IP changes with cursor/account/instance filters. Events describe scan observations, not proven cloud creation/deletion or operator intent. Only complete product scans infer disappearance; unknown status, incomplete IPv4 topology and stale IPv6 do not overwrite comparison baselines. Existing installations start field baselines without inventing historical changes.
# 2026-11-12  IPv6 discovery: optional Instance.ipv6 exposes assigned ECS IPv6 addresses separately from public IPv4 and billing topology. Read instance extensions first, then per-instance ENIs with a 3-second total fallback deadline. Failed refreshes retain the previous result as stale, including its original observation time; only a successful complete read may clear addresses. SWAS is null pending a verified source.
# 2026-11-12  Bandwidth mismatch alerts: add spec_bandwidth_insufficient (empty params, non-urgent). Fresh ECS network_capacity comparisons drive incident/recovery; unknown data is not recovery. The comparison concerns configured public outbound ceiling versus specification capability, not measured traffic.
# 2026-11-12  Expiration reminders: add instance_expiring with before_days=7 by default. Evaluate only freshly collected subscription expiry dates, deduplicate active incidents and track renewal-date changes; disabled/released targets cancel pending reminders. Auto-renew enabled does not suppress a reminder. Notifications are persisted only; Telegram dispatch remains unwired.
# 2026-11-12  Instance renewal snapshot: optional renewal object reports auto/manual/no-renewal/unknown/not-applicable with source, check time and safe error. ECS uses its subscription-only API; SWAS uses BSS records matched by instance ID, region and subscription type. Missing or conflicting records never mean disabled auto-renewal. No renewal write operations are added.
# 2026-11-12  API Key management: session/CSRF-protected create, paginated list and soft revocation. Creation returns the secret once; subsequent responses expose metadata only. Scopes are fixed to summary:read, instance:control and cron:run; they do not grant browser-session or agent-report access. Integration consumers are separate from this management API.
# 2026-11-12  Account finance: GET /accounts/{account_id}/finance reads cached balance and current-month bill overview only. Money is decimal text with provider currency; bill types remain separate, no guessed net total. Sources retain last successful data on failure and are fenced by credential version; the configured business timezone selects the requested billing cycle.
# 2026-11-12  Correct SystemInfo.latest_agent_version: nullable, sourced from the same verified local release as Agent.available_version, never the hm-server build version. Frontends must use Agent.update_available===true, not version-string inequality, to show upgrade hints.
# 2026-11-12  Agent upgrade hints: optional nullable available_version/update_available refer to the server's locally configured, checksum-verified agent release. Semantic versions compare by precedence; dev/unknown versions yield null. Release checks are cached for at most 30 seconds; obtaining an upgrade command always revalidates artifacts and uses the existing install-command endpoint.
# 2026-11-12  Read-only bandwidth checks: Instance.network_capacity optionally exposes ECS specification RX/TX limits in kbit/s, source timestamp/error and a nullable comparison against the configured public outbound ceiling. Unknown topology, multiple billing exits, missing specifications and SWAS do not produce a passing result. No GET-triggered cloud calls or protective action.
# 2026-11-12  Configurable agent cadence: optional nullable Agent.report_interval_seconds reports the latest accepted cadence (1–60 seconds); settings.collection.agent_report_interval_seconds remains the default, not a global override. Offline alert timeout remains separately configurable.
# 2026-11-12  Source-health alerts: production lists account_api_failure, cdt_official_unavailable and agent_offline only; usage/forecast remain unavailable pending metering decisions. Persisted offline timeout drives both status and alerts. Add notification.updated SSE for delivery/cancellation changes; evaluation records events without dispatching Telegram yet.
# 2026-11-12  Notification reads: encrypted channel configuration exposes only safe metadata and proxy_auth_set; add not_tested so saved credentials are not reported healthy before a successful send. Notification history adds attempts, last_error, delivered_at and has_uncertain_attempt to distinguish workflow failure from unconfirmed delivery. Update/dispatch policy remains pending user decisions.
# 2026-11-12  Agent install-command validates a complete local release before issuing a code; missing/corrupt files return 503 agent_release_unavailable. Generated commands pin installer and manifest checksums, pass the one-time code via stdin and keep active tokens until registration succeeds.
# 2026-11-12  Agent ingestion: optional pending_first_report/data_quality distinguish registration from fresh samples. instance.realtime SSE can explicitly clear stale rates with null. New grant replaces the old code but retains the active token until successful registration; revocation gives not_installed. Metadata is not remote attestation. See docs/m0/agent-protocol.md.
# 2026-11-12  CDT observations: official_quality=inferred, fetched_at separate from unknown cutoff; user approved provisional byte display only. Add raw cumulative observation history; daily values remain unknown without a verified daily source. Quota/daily freshness is nullable before first collection.
# 2026-11-12  Accounts/discovery: local quotas use configurable 1024^3-byte units (user approved; not official alignment). Account updates fence stale jobs; disabled accounts retain snapshots. Jobs persist/recover leases; GET reads snapshots only. Multi-exit instances expose billing_subject_ids; ambiguous billing/charge types remain unknown.
# 2026-11-12  Production auth: single administrator confirmed; setup token supplied outside logs, one-use/24h; HTTPS origin and CSRF checks; configurable absolute session lifetime, persistent login limits. Account removal retains history and disables collection (user decision).
# 2026-11-11  前端  起草 M1 部分（v0.1.0-draft）。
# 2026-11-11  Backend review: nullable unknown usage/eligibility, calendar reset, GET auth, data timezone; reasons in docs/m0/contract-review.md. Still draft.
# 2026-11-11  Unified implementation: SystemInfo adds data_mode/read_only so independently deployed frontends identify demo data and unavailable writes.
# 2026-11-11  Protection clarification: unprotected also includes missing/unalignable metering data; an online agent alone does not imply protection.
#
# ── 待后端确认 ──────────────────────────────────────────────────────────────
# B1  流量单位：面板把字节换算成 GB 时用 1024^3 还是 10^9？需要与 CDT 账单口径一致（与 M0 的 V2 一起确认）。
#     前端暂按 1024^3，只有一个常量，随时可改。
# B2  CSRF：草稿约定登录 / 安装 / GET /session 的响应体里返回 csrf_token，之后所有非 GET 请求带
#     X-CSRF-Token 请求头。是否可行？如果你更想用"双重提交 Cookie"，请直接改这里。
# B3  会话 Cookie 名称草稿写的是 hm_session（HttpOnly、SameSite=Lax）。名称与有效期由你定。
# B4  只有一个管理员、没有用户名（PRD 只写了"管理员密码"）。登录只提交密码，是否与你的设计一致？
# B5  错误体在 WORK_SPLIT 约定的 {code, message} 之外，草稿加了两个可选字段：
#     fields（表单字段 -> 错误码，用于把错误标在具体输入框上）与 retry_after_seconds（登录限速）。能否提供？
# B6  SSE：一条事件流 GET /api/v1/events，事件名见该接口说明。需要确认：
#     (a) 是否支持 Last-Event-ID 续传，还是断线重连后由前端整页重新拉取（草稿按后者）；
#     (b) 心跳间隔（草稿 15 秒一条 ping）；
#     (c) quota.updated 是每个 agent 上报周期（10 秒）都推一次，还是数值变化才推。
# B7  总览页的四个数字、额度池、"需要留意"列表，草稿不设单独的汇总接口，前端用 /accounts、/instances、
#     /traffic/quotas 的结果自己合计。实例很多时是否需要一个 /overview 汇总接口，由你判断。
# B8  Instance.realtime_protection 由后端计算（见枚举说明）。"是否受实时保护"的判定是否能在后端统一给出？
# B9  每日用量 /traffic/daily 的"一天"按哪个时区切分？草稿假设按业务时区（默认 Asia/Shanghai），
#     并由后端在 date 字段里直接给出 YYYY-MM-DD。CDT 官方每日数据的切分方式见 M0 的 V3。
# B10 "今天"这一天的数值 = 官方已出账部分 + 实时增量，草稿用 provisional=true 标记。能否提供？
# B11 共享带宽每小时入 / 出（/bandwidth-packages/{id}/hourly）依赖"按小时聚合"的计费周期假设（M0 的 V4）。
#     如果周期不是 1 小时，period_seconds 字段会告诉前端实际长度。
# B12 计费对象的"官方 / 实时 / 差值"：CDT 官方只有账号合计（PRD 6.3），所以草稿把这三项放在账号级的
#     QuotaStatus 里，计费对象只给今日入 / 出 / 计量值。这一点也已提给用户（PRD F17 流量页的描述需要澄清）。
# B13 通知的 title / body：草稿约定由后端按前端提供的文案模板渲染成中文后返回（因为同一段文字还要发到
#     Telegram）。模板放在 docs/design/ 下，M1 开始时提供。是否接受这种方式？
# B14 告警规则 /alert-rules：后端只返回当前里程碑已经可用的规则；params 是一个固定结构的对象（见 AlertRuleParams），
#     每条规则只用到其中一部分字段。M1 需要的 key：cdt_usage、cdt_forecast_exceed、account_api_failure、
#     agent_offline、cdt_official_unavailable。
# B15 安装命令 POST /instances/{id}/agent/install-command：每次调用是否会让上一次的注册码失效？
#     注册码有效期多长（草稿 expires_at 由后端给出，前端显示倒计时）？
# B16 撤销 agent token 后，实例上的 agent 状态变为 not_installed 还是 offline？草稿按 not_installed
#     （需要重新安装），并且不触发掉线告警。
# B17 权限测试、Telegram 测试消息都按 202 + job_id 处理，结果放在 Job.result 里（结构见 Job 说明）。
#     如果你认为测试消息同步返回更合适，请改。
# B18 删除账号时，其下的实例、agent、历史数据怎么处理？前端的确认文案需要如实告诉用户后果。
# B19 "数据过期"的判定：草稿由前端按 updated_at 与固定时长比较（实时 60 秒、CDT 官方 2 小时、资源扫描 30 分钟）。
#     如果后端更清楚各自的采集周期，可以改为在 /settings 里返回这些时长（草稿已放了 collection 只读字段）。
# B20 分页：实例、通知用游标分页；账号、计费对象、共享带宽、告警规则数量很少，草稿不分页。
# B21 OpenAPI 版本用 3.0.3（Go 侧的代码生成工具普遍支持）。如果你用的工具要求 3.1，请告知。

openapi: 3.0.3
info:
  title: Harbormaster 面板接口
  version: 0.1.0-draft
  description: |
    面板与 hm-server 之间的唯一接口契约。通用约定（见 docs/WORK_SPLIT.md 第 3 节）：

    - 前缀 `/api/v1`，JSON，UTF-8。
    - 时间一律 UTC、RFC 3339；时区换算与显示由前端做。
    - 流量一律整数字节（int64）；速率为"字节每秒"。
    - 枚举为英文 snake_case；中文显示由前端做。
    - 错误体 `{"error": {"code": "...", "message": "..."}}`，`code` 稳定可枚举。
    - 认证：Cookie 会话 + `X-CSRF-Token` 请求头；未登录 401，无权限 403。
    - 耗时操作返回 `202` 与 `job_id`，用 `GET /jobs/{job_id}` 或事件流查询结果。
    - 来自阿里云或 agent 的数据都带 `updated_at`。
    - M0 development mode serves synthetic read data and local sessions only; unsupported operations return 501 with error.code=not_implemented. No cloud or Telegram calls occur.
    - Session cookies use HttpOnly and SameSite=Lax; production HTTPS also uses Secure. GET does not require CSRF; authenticated mutations do.
    - Production browser API requires HTTPS and the configured public host. All mutations, including setup/login/logout, require an Origin matching HM_PUBLIC_URL. Forwarded headers are accepted only from configured trusted proxies; optional admin CIDRs apply only to panel APIs.
    - Production sessions have a configurable absolute lifetime (default 12 hours), without sliding renewal. Logout and CLI password reset revoke sessions server-side. Login/setup allow five attempts per source IP per five minutes, with a shared thirty-attempt ceiling; 429 includes Retry-After and retry_after_seconds.
    - SSE uses a 15-second ping, no replay guarantee, and a fresh snapshot after reconnect. Updates may be coalesced per 10-second report interval.
    - Account quota values are locally configured protection budgets, defaulting to 20/200 x 1024^3 bytes; they do not establish CDT eligibility or a verified official cutoff. Account disable retains snapshots/history and stops new cloud requests; an already-sent request may finish but its stale result cannot replace the disabled account's snapshots.
    - Refresh/permission jobs are persisted with leases and recover after restart. Repeated requests for the same active job scope/type may return the existing job ID. GET endpoints only read database snapshots and never query the cloud.

servers:
  - url: /api/v1

tags:
  - name: setup
    description: 首次安装向导
  - name: session
    description: 登录与会话
  - name: system
    description: 版本、设置、任务、事件流
  - name: accounts
    description: 阿里云账号
  - name: instances
    description: 实例与采集程序（hm-agent）
  - name: traffic
    description: 流量与额度
  - name: notify
    description: 通知渠道、告警规则、通知记录

  - name: network
    description: 测速点、目标、组合与历史

security:
  - sessionCookie: []

paths:
  /network/ipdb:
    get:
      tags: [network]
      operationId: getOfflineIPDatabaseStatus
      summary: Read offline IP database versions and resources
      description: Local status only; no download or online IP lookup. Default bundled ASN+country datasets, optional downloaded city. DB-IP Lite attribution must be displayed with data-derived results. Memory values describe the process; mapped file bytes are not resident RAM. City mode can exceed the default memory budget.
      responses:
        "200":
          description: Loaded dataset metadata and most recent update attempt
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IPDatabaseStatus"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503": {description: ipdb_unavailable}
  /network/plans/{id}/trace-schedule:
    get:
      tags: [network]
      operationId: getTraceSchedule
      summary: Read a plan's daily trace settings
      description: Default is disabled with revision 0. Active requires both schedule and probe plan enabled. Timezone is the business timezone last applied by the scheduler; next_run_at is null while inactive.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Cached schedule with no network operations
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TraceSchedule"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      tags: [network]
      operationId: saveTraceSchedule
      summary: Configure a daily trace snapshot
      description: Session and CSRF required. Inherit the probe plan source, target, family and method; use the target's TCP port. Enabling requires an enabled plan. New or edited settings and plan edits start at the next daily time; downtime misses schedule one current trace and advance to the next daily time. Pausing, deletion or edits cancel queued old traces; running measurements can finish without stale alerts. No synchronous DNS or packets. Demo is read-only.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TraceScheduleInput"}
      responses:
        "200":
          description: Saved settings
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TraceSchedule"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: network_configuration_changed or plan_disabled}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /network/plans/{id}/trace-snapshots:
    get:
      tags: [network]
      operationId: listTraceSnapshots
      summary: List scheduled trace snapshots and comparisons
      description: At most 31 days by actual scheduling time; inclusive from and exclusive to, no future to. Newest sequence first, cursor bound to plan and range. Includes skipped opportunities; never fabricate missed history. Retired plans retain history. Comparisons and notifications are generated in the background, never by GET. A comparison is with the immediately preceding opportunity, including gaps; manual traces do not enter this sequence.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: from, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: true, schema: {type: string, format: date-time}}
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Stored opportunities and comparisons
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/TraceSnapshot"}}
                  next_cursor: {type: string, nullable: true}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /network/duplex-traces:
    post:
      tags: [network]
      operationId: submitDuplexTrace
      summary: Atomically enqueue traces from both managed endpoints
      description: Session and CSRF required. Select two distinct managed ECS/SWAS instances with current trace-capable agents. Both must have one fresh public address in the selected family. Validate and enqueue both directions in one transaction; either unavailable or full queue leaves neither job. After acceptance each direction executes independently under its own lease. Start times can differ; a later failure never fabricates or replays the other result. The request_key namespace is specific to this endpoint; identical decoded retries return the original pair even after endpoint changes, changed input conflicts. TCP ports are explicit per destination direction. No foreground DNS/cloud/packets. Demo writes return 501.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DuplexTraceSubmission"}
      responses:
        "202":
          description: Both directions accepted atomically
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DuplexTraceAccepted"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: "request_conflict, probe_queue_full, duplex_same_address, or fixed point/target unavailable reason from the manual trace API"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /network/duplex-traces/{id}:
    get:
      tags: [network]
      operationId: getDuplexTrace
      summary: Read both saved trace directions
      description: Frozen managed endpoint names and address observations plus each current trace detail. Queued legs are cancelled if either endpoint's selected address changes or discovery becomes incomplete/stale/unavailable. Already running legs preserve their pinned request and independent result. Agent availability for the other direction is not a reason to replay a completed leg. No cloud, DNS or probe work starts on GET.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Independent forward and reverse state/results
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DuplexTrace"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /network/duplex-traces/{id}/export:
    get:
      tags: [network]
      operationId: exportDuplexTrace
      summary: Export both stored directions as text
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: UTF-8 text with frozen endpoints and both trace exports including available attribution
          content:
            text/plain:
              schema: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /network/traces:
    post:
      tags: [network]
      operationId: submitNetworkTrace
      summary: Enqueue a fixed traceroute
      description: Session and CSRF required. Checks local snapshots only; DNS and packets run in the background. Select exactly one saved target (with revision) or direct public host. Port is explicit, overriding the saved target TCP port. Same request_key and decoded input after defaults return the same job, including after completion; changed input conflicts. Unavailable point/target or unsupported method returns 409 without a job. Running tasks may finish after target edits; queued tasks are cancelled on target edits or changed/incomplete managed address evidence.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TraceSubmission"}
      responses:
        "202":
          description: Accepted without synchronous network work
          content:
            application/json:
              schema:
                type: object
                required: [job_id, trace_id]
                properties:
                  job_id: {type: string}
                  trace_id: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: "network_configuration_changed, request_conflict, probe_queue_full, trace_method_unavailable, or a fixed point/target unavailable reason"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
    get:
      tags: [network]
      operationId: listNetworkTraces
      summary: List stored traceroute summaries
      description: At most 31 days by submission time, inclusive from/exclusive to, no future to. Newest sequence first. Cursor bound to range and filters. Summary only; raw hops are read from detail. Missing results remain null. Deleted targets and disabled accounts retain history. No retention guarantee is implied by query bounds.
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: point_id, in: query, schema: {type: string, maxLength: 128}, description: server or managed source instance ID}
        - {name: target_id, in: query, schema: {type: string, maxLength: 128}, description: Saved target ID}
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Stored summaries, never performs network operations
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/TraceRun"}}
                  next_cursor: {type: string, nullable: true}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /network/traces/{id}:
    get:
      tags: [network]
      operationId: getNetworkTrace
      summary: Read a stored traceroute and raw hops
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Current task status and accepted result; partial results remain incomplete
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TraceDetail"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /network/traces/{id}/export:
    get:
      tags: [network]
      operationId: exportNetworkTrace
      summary: Export stored trace as plain text
      description: Includes state, request, individual responses and any saved enrichment with dataset versions and attribution. Export starts no lookups. Pending traces export their current state with no fabricated hops or metadata.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: UTF-8 text attachment
          content:
            text/plain:
              schema: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /network/targets:
    get:
      tags: [network]
      operationId: listNetworkTargets
      summary: List cached network targets
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Cached rows ordered by ID ascending; live keyset pagination. No cloud, DNS or network probe on GET.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/NetworkTarget"}
                  next_cursor: {type: string, nullable: true}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
    post:
      tags: [network]
      operationId: createNetworkTargets
      summary: Create a network target
      description: Local creation only. revision must be 0. New enabled plans are due immediately; no synchronous probe.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NetworkTargetInput"}
      responses:
        "409": {description: network_configuration_changed}
        "404": {$ref: "#/components/responses/NotFound"}
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NetworkTarget"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /network/targets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    get:
      tags: [network]
      operationId: getNetworkTarget
      summary: Get a network target
      responses:
        "200":
          description: Current cached record
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NetworkTarget"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      tags: [network]
      operationId: updateNetworkTarget
      summary: Replace a network target
      description: Replace configuration with matching revision. Queued runs using old configuration are cancelled; already running measurements may finish. Enabled plans become due now. Optional numeric plan fields reset to documented defaults when omitted.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NetworkTargetInput"}
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NetworkTarget"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: network_configuration_changed}
        "422": {$ref: "#/components/responses/ValidationFailed"}
    delete:
      tags: [network]
      operationId: deleteNetworkTarget
      summary: Retire a network target
      description: Retire with history retained; body revision is required. A target referenced by an undeleted plan returns target_in_use. Queued runs are cancelled; running measurements may finish.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              properties:
                revision: {type: integer, format: int64, minimum: 0}
      responses:
        "204": {description: Retired}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: network_configuration_changed or target_in_use}
  /network/plans:
    get:
      tags: [network]
      operationId: listNetworkPlans
      summary: List cached probe plans
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Cached rows ordered by ID ascending; live keyset pagination. No cloud, DNS or network probe on GET.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/ProbePlan"}
                  next_cursor: {type: string, nullable: true}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
    post:
      tags: [network]
      operationId: createNetworkPlans
      summary: Create a probe plan
      description: Local creation only. revision must be 0. New enabled plans are due immediately; no synchronous probe.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProbePlanInput"}
      responses:
        "409": {description: network_configuration_changed}
        "404": {$ref: "#/components/responses/NotFound"}
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProbePlan"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /network/plans/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    get:
      tags: [network]
      operationId: getNetworkProbePlan
      summary: Get a probe plan
      responses:
        "200":
          description: Current cached record
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProbePlan"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      tags: [network]
      operationId: updateNetworkProbePlan
      summary: Replace a probe plan
      description: Replace configuration with matching revision. Queued runs using old configuration are cancelled; already running measurements may finish. Enabled plans become due now. Optional numeric plan fields reset to documented defaults when omitted.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProbePlanInput"}
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProbePlan"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: network_configuration_changed}
        "422": {$ref: "#/components/responses/ValidationFailed"}
    delete:
      tags: [network]
      operationId: deleteNetworkProbePlan
      summary: Retire a probe plan
      description: Retire with history retained; body revision is required. A target referenced by an undeleted plan returns target_in_use. Queued runs are cancelled; running measurements may finish.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              properties:
                revision: {type: integer, format: int64, minimum: 0}
      responses:
        "204": {description: Retired}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: network_configuration_changed or target_in_use}
  /network/points:
    get:
      tags: [network]
      operationId: listNetworkPoints
      summary: List cached probe point availability
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Server plus managed instances, cached availability only. Agent availability requires fresh traffic heartbeat and a recent authenticated probe poll for the current token; it does not prove raw socket permissions or reachability.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/ProbePoint"}
                  next_cursor: {type: string, nullable: true}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /network/plans/{id}/runs:
    get:
      tags: [network]
      operationId: listProbeRuns
      summary: Read probe runs and skipped attempts
      description: Cached individual measurements and explicit skipped attempts. No backfilled data or zero-fill for missing periods; does not aggregate different resolved addresses. Retired plan history remains readable.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
        - name: from
          in: query
          required: true
          schema: {type: string, format: date-time}
        - name: to
          in: query
          required: true
          schema: {type: string, format: date-time}
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Up to seven days, inclusive from/exclusive to, to no later than now. Newest run sequence first; cursor bound to plan and range.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/ProbeRun"}
                  next_cursor: {type: string, nullable: true}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /setup/status:
    get:
      tags: [setup]
      operationId: getSetupStatus
      summary: 是否已完成首次安装
      security: []
      responses:
        "200":
          description: 安装状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"

  /setup:
    post:
      tags: [setup]
      operationId: completeSetup
      summary: 用初始化 token 设置管理员密码
      description: 成功后原子地建立单管理员及登录会话（Set-Cookie），保存业务时区并消耗初始化凭证。只能成功一次，之后返回 409 `already_initialized`。初始化 token 由 HM_SETUP_TOKEN 或数据目录外的 HM_SETUP_TOKEN_FILE 提供，数据库只存哈希，有效期 24 小时，不写日志；过期后需运维提供新 token 并重启。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201":
          description: 已初始化并登录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "403":
          description: 初始化 token 不正确或已过期（`invalid_setup_token`），或请求来源不符（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

  /session:
    get:
      tags: [session]
      operationId: getSession
      summary: 当前会话
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 已登录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [session]
      operationId: login
      summary: 用管理员密码登录
      description: 单管理员，无用户名；生产环境要求同源 Origin。密码限 12–1024 UTF-8 字节，首次设置状态由 setup/status 查询。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: 密码不正确或密码登录已关闭（`invalid_credentials`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
    delete:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [session]
      operationId: logout
      summary: 退出登录
      responses:
        "204":
          description: 已退出
        "401":
          $ref: "#/components/responses/Unauthorized"

  /session/password:
    patch:
      tags: [session]
      operationId: setPasswordLoginEnabled
      summary: 开关密码登录
      description: >-
        只影响后续密码认证，保留现有会话。重新开启使用原密码，不修改密码。
        关闭前要求至少一个已注册且 RP 与当前 HTTPS public_url 匹配的 Passkey，
        与凭据删除在事务中防止竞态；不满足时返回 409 passkey_required。
        丢失设备后使用 CLI reset-password，重新启用密码、清除所有会话和挑战、保留 Passkey。
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: {type: boolean}
      responses:
        "200":
          description: 已持久保存开关。
          content:
            application/json:
              schema:
                type: object
                required: [password_enabled]
                properties:
                  password_enabled: {type: boolean}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/ValidationFailed"}

  /session/methods:
    get:
      tags: [session]
      operationId: getLoginMethods
      summary: 可用登录方式
      security: []
      responses:
        "200":
          description: 密码开关为持久设置；Passkey 需配置 HTTPS public_url 且已注册当前 RP 的凭据。未初始化时两项均为 false。
          content:
            application/json:
              schema:
                type: object
                required: [password_enabled, passkey_enabled]
                properties:
                  password_enabled: {type: boolean}
                  passkey_enabled: {type: boolean}

  /passkeys:
    get:
      tags: [session]
      operationId: listPasskeys
      summary: 已注册 Passkey
      responses:
        "200":
          description: 最多 20 个；不返回公钥、凭据原文或用户句柄。
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Passkey"}
        "401":
          $ref: "#/components/responses/Unauthorized"

  /passkeys/{passkey_id}:
    parameters:
      - name: passkey_id
        in: path
        required: true
        schema: {type: string}
    delete:
      tags: [session]
      operationId: deletePasskey
      summary: 删除 Passkey
      description: 立即阻止后续使用该凭据完成登录；不删除已建立的会话。关闭密码登录时，不能删除当前 RP 的最后一个可用 Passkey（409 last_passkey）。
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204": {description: 已删除}
        "409": {$ref: "#/components/responses/Conflict"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /passkeys/registration/options:
    post:
      tags: [session]
      operationId: beginPasskeyRegistration
      summary: 开始 Passkey 注册
      description: >-
        生产要求同源 HTTPS。挑战有效期五分钟、单次使用，验证失败也消耗挑战。
        注册绑定当前管理员会话；登录绑定 Secure/HttpOnly/SameSite=Strict 的 hm_passkey cookie，
        同一浏览器再次开始登录会替换绑定 cookie。登录开始与完成各计入已有登录限速。
        注册要求 discoverable credential 和 userVerification=required；不允许跨源 iframe。
        503 passkey_unavailable 表示 HTTPS public_url 未配置；401 invalid_passkey 表示挑战或凭据无效。
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PasskeyRegistrationBegin"}
      responses:
        "200":
          description: 成功
