    OfficialDataStatus:
      type: string
      enum: [ok, unavailable, never_fetched, cutoff_unknown]
      description: unavailable = CDT 官方接口连续取不到数据，正沿用最近一次官方值。

    QuotaStatus:
      type: object
      description: Missing official values are null, never zero. An unknown official cutoff makes the aligned increment, estimate and effective value null; fetched_at must not be substituted for the cutoff.
      required:
        - account_id
        - scope
        - cycle_start
        - cycle_end
        - quota_bytes
        - official_bytes
        - official_as_of
        - official_status
        - realtime_increment_bytes
        - worst_case_bytes
        - estimated_bytes
        - effective_bytes
        - thresholds_percent
        - forecast
        - updated_at
      properties:
        account_id:
          type: string
        scope:
          $ref: "#/components/schemas/QuotaScope"
        cycle_start:
          type: string
          format: date-time
          description: 本地保护额度的参考周期开始；不表示来源确认了官方账期。
        cycle_end:
          type: string
          format: date-time
          description: 本地保护额度的参考周期结束。
        quota_bytes:
          type: integer
          format: int64
        official_bytes:
          type: integer
          format: int64
          nullable: true
          description: 最近一次 CDT 官方值。
        official_as_of:
          type: string
          format: date-time
          nullable: true
          description: 官方数据的截止时刻（界面显示"官方（截至 hh:mm）"）。
        official_quality:
          type: string
          enum: [verified, inferred, unknown]
          description: inferred 表示按字节暂解释，单位与计费口径待核实；不能作为精确对齐依据。
        fetched_at:
          type: string
          format: date-time
          nullable: true
          description: 当前显示的官方累计值被抓取的时间，不是统计截止时间。
        official_status:
          $ref: "#/components/schemas/OfficialDataStatus"
        realtime_increment_bytes:
          type: integer
          format: int64
          nullable: true
          description: 官方截止时刻之后，按各计费对象规则算出的增量（含最坏情况推算部分）。
        worst_case_bytes:
          type: integer
          format: int64
          nullable: true
          description: realtime_increment_bytes 中因 agent 掉线而按最坏情况推算出来的部分；没有则为 0。
        estimated_bytes:
          type: integer
          format: int64
          nullable: true
          description: 实时估算 = official_bytes + realtime_increment_bytes。
        effective_bytes:
          type: integer
          format: int64
          nullable: true
          description: 告警判断用的数值 = max(官方, 实时估算)。
        thresholds_percent:
          type: array
          items:
            type: integer
        forecast:
          type: object
          nullable: true
          description: 数据不足以预测时为 null。
          required: [daily_average_bytes, cycle_end_bytes, exceeds_on]
          properties:
            daily_average_bytes:
              type: integer
              format: int64
              description: 近 7 天日均用量。
            cycle_end_bytes:
              type: integer
              format: int64
              description: 按日均线性推算到周期结束时的用量。
            exceeds_on:
              type: string
              format: date
              nullable: true
              description: 预计超出免费额度的日期（业务时区）；不会超额为 null。
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: 这份数据最近的实际检查时间；未抓取时为 null，不是官方统计截止时间。

    DailyTraffic:
      type: object
      description: Aggregate in the returned data_timezone. Do not relabel provider daily totals as a different business timezone.
      required: [account_id, cycle_start, cycle_end, days, updated_at, data_timezone]
      properties:
        source_status:
          type: string
