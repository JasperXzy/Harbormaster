                stop_mode:
                  type: string
                  enum: [keep_charging, stop_charging]
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Instance is absent from managed discovery.
