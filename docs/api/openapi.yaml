  /instances/{instance_id}/finance:
    parameters:
      - name: instance_id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [instances]
      operationId: getInstanceFinance
      summary: Cached current-month bill rows attributable to this instance
      description: Background account-wide DescribeInstanceBill collection, MONTHLY and IsBillingItem=false. Exact cloud instance ID plus ECS/SWAS product family matching; no shared bandwidth, EIP or CDT costs allocated to instances. Current business month only; no previous-month substitution. Data can lag consumption by 24 hours and omits unbilled usage. No cloud calls on GET. Credential rotation hides predecessor data; disabled accounts retain current-credential cache.
      responses:
        "200":
          description: Last successful matching rows or null if never obtained. Empty items mean no matching bill rows, not zero cost. No total or refund netting is inferred.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceFinance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /accounts/{account_id}/finance:
    parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [accounts]
      operationId: getAccountFinance
      summary: Cached account balance and current-month bill overview
      description: Read-only snapshots refreshed by resource collection. No cloud call on GET. A refresh uses the existing instances/refresh job API. Disabled accounts retain cached data. The bill is the provider account overview, including its returned product categories; no exchange conversion or inferred refund netting.
      responses:
        "200":
          description: Cached finance sources; missing data is null, never an inferred zero.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountFinance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api-keys:
    get:
      tags: [system]
      operationId: listAPIKeys
      summary: List API Key metadata, including revoked keys
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Newest first; no secret or token hash is returned.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/APIKey"
                  next_cursor:
                    type: string
                    nullable: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    post:
      tags: [system]
      operationId: createAPIKey
      summary: Create an API Key and return its secret once
      description: Grants are immutable; create a replacement and revoke the old key to change scopes. Keys remain valid until revoked. Losing this response does not permit secret retrieval; use the metadata list to revoke and replace the key. Creating a grant does not implement or enable unavailable control/cron operations.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                scopes:
                  type: array
                  minItems: 1
                  maxItems: 3
                  uniqueItems: true
                  items:
                    $ref: "#/components/schemas/APIKeyScope"
      responses:
        "201":
          description: Secret appears only in this response; do not log or persist it in frontend state storage.
          content:
            application/json:
              schema:
                type: object
                required: [api_key, token]
                properties:
                  api_key:
                    $ref: "#/components/schemas/APIKey"
                  token:
                    type: string
                    description: One-time creation response secret. This field is deliberately absent from list responses.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api-keys/{key_id}:
    parameters:
      - name: key_id
        in: path
        required: true
        schema:
          type: string
    delete:
      tags: [system]
      operationId: revokeAPIKey
      summary: Revoke an API Key
      description: Idempotent for an existing key. Metadata is retained; subsequent authentication fails. Does not create or execute a cloud job.
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Revoked, or already revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /notify/telegram:
    get:
      tags: [notify]
      operationId: getTelegramChannel
      summary: Telegram 渠道设置
      responses:
        "200":
          description: Telegram 设置（不返回 Bot Token）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramChannel"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [notify]
      operationId: updateTelegramChannel
      summary: 保存 Telegram 渠道设置
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramChannelUpdate"
      responses:
        "200":
          description: 保存后的设置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramChannel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /notify/telegram/test:
    post:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [notify]
      operationId: sendTelegramTest
      summary: 发送一条测试消息
      description: 用已保存的设置发送。任务失败时 `Job.error.code` 说明原因（如 `telegram_unauthorized`、`telegram_chat_not_found`、`telegram_unreachable`）。
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: 还没有配置 Telegram（`telegram_not_configured`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /alert-rules:
    get:
      tags: [notify]
      operationId: listAlertRules
      summary: 内置告警规则
      description: Returns only rules with implemented, usable evidence sources. Production currently supports account_api_failure, cdt_official_unavailable, agent_offline, instance_expiring, spec_bandwidth_insufficient, instance_public_ip_changed, balance_low, network_latency, network_loss, network_unreachable and network_route_change. Usage/forecast rules are not returned until their metering source and policy are available.
      responses:
        "200":
          description: 告警规则
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AlertRule"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /alert-rules/{rule_key}:
    parameters:
      - name: rule_key
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/AlertRuleKey"
    patch:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [notify]
      operationId: updateAlertRule
      summary: 开关规则或调整阈值
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertRuleUpdate"
      responses:
        "200":
          description: 修改后的规则
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /notifications:
    get:
      tags: [notify]
      operationId: listNotifications
      summary: 通知记录（新的在前）
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 通知记录
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Notification"
                  next_cursor:
                    type: string
                    nullable: true
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    integrationBearer:
      type: http
      scheme: bearer
      bearerFormat: Harbormaster API Key
      description: Requires the endpoint scope; never grants a browser session or agent authentication.
    sessionCookie:
      type: apiKey
      in: cookie
      name: hm_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required for authenticated mutations; not required for GET, initial setup or login. Value comes from Session.csrf_token.

  parameters:
    AccountId:
      name: account_id
      in: path
      required: true
      schema:
        type: string
    InstanceId:
      name: instance_id
      in: path
      required: true
      description: Harbormaster 内部的实例 ID（Instance.id），不是阿里云实例 ID。
      schema:
        type: string
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string

  responses:
    UnsupportedMediaType:
      description: 请求体必须使用 application/json（`unsupported_media_type`）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: 来源、HTTPS 或管理员地址限制不满足（`forbidden`、`csrf_failed`）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: 未登录（`unauthenticated`）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: 不存在（`not_found`）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: 与当前状态冲突（`already_initialized`、`account_name_taken` 等）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationFailed:
      description: 输入不合法（`validation_failed`，`fields` 指出具体字段）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: 尝试次数过多（`rate_limited`，`retry_after_seconds` 给出等待时间）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    JobAccepted:
      description: 已进入任务队列
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/JobAccepted"

  schemas:
    NetworkTargetInput:
      type: object
      required: [revision, name, kind, host, instance_id, tcp_port, enabled]
      properties:
        revision: {type: integer, format: int64, minimum: 0}
        name: {type: string, minLength: 1, maxLength: 100}
        kind: {type: string, enum: [custom, instance]}
        host:
          type: string
          nullable: true
          description: Public IP or IDNA domain for custom targets; null for instance targets. No URL, port or credentials. DNS is checked only during execution.
        instance_id:
          type: string
          nullable: true
          description: Required only for instance targets. Follow the selected family's unique public address from complete discovery of the current credential version, at most ten minutes old; never choose arbitrarily.
        tcp_port: {type: integer, nullable: true, minimum: 1, maximum: 65535}
        enabled: {type: boolean}
    NetworkTarget:
      allOf:
        - $ref: "#/components/schemas/NetworkTargetInput"
        - type: object
          required: [id, created_at, updated_at]
          properties:
            id: {type: string}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
    ProbePlanInput:
      type: object
      required: [revision, name, point_kind, instance_id, target_id, family, method, enabled]
      properties:
        revision: {type: integer, format: int64, minimum: 0}
        name: {type: string, minLength: 1, maxLength: 100}
        point_kind: {type: string, enum: [server, agent]}
        instance_id: {type: string, nullable: true, description: Source managed instance for agent point; null for server.}
        target_id: {type: string}
        family: {type: string, enum: [ipv4, ipv6]}
        method: {type: string, enum: [icmp, tcp], description: TCP uses the target's explicit tcp_port; missing port skips execution.}
        frequency_seconds: {type: integer, minimum: 60, maximum: 86400, default: 300}
        count: {type: integer, minimum: 1, maximum: 20, default: 5}
        timeout_ms: {type: integer, minimum: 100, maximum: 5000, default: 2000}
        interval_ms: {type: integer, minimum: 100, maximum: 5000, default: 1000, description: Wait after each completed attempt; total worst-case measurement budget must not exceed 60 seconds.}
        enabled: {type: boolean}
    ProbePlan:
      allOf:
        - $ref: "#/components/schemas/ProbePlanInput"
        - type: object
          required: [id, created_at, updated_at, next_run_at, last_run]
          properties:
            id: {type: string}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
            next_run_at: {type: string, format: date-time, nullable: true}
            last_run:
              type: object
              nullable: true
              allOf:
                - $ref: "#/components/schemas/ProbeRun"
    ProbePoint:
      type: object
      required: [id, name, point_kind, instance_id, available, unavailable_reason, updated_at, trace]
      properties:
        id: {type: string, description: server or managed instance ID.}
        name: {type: string}
        point_kind: {type: string, enum: [server, agent]}
        instance_id: {type: string, nullable: true}
        available: {type: boolean}
        unavailable_reason: {type: string, nullable: true}
        updated_at: {type: string, format: date-time, nullable: true}
        trace:
          $ref: "#/components/schemas/TraceCapability"
    IPDatabaseDataset:
      type: object
      required: [name, edition, built_at, size_bytes, origin, storage, source_url]
      properties:
        name: {type: string}
        edition: {type: string, description: Release month YYYY-MM}
        built_at: {type: string, format: date-time}
        size_bytes: {type: integer, format: int64}
        origin: {type: string, enum: [bundled, downloaded]}
        storage: {type: string, enum: [memory, mmap]}
        source_url: {type: string, format: uri}
    IPDatabaseStatus:
      type: object
      required: [mode, city_enabled, auto_update, asn, country, city, last_check_at, last_update_at, last_error, attribution, go_heap_alloc_bytes, process_peak_rss_bytes, mapped_file_bytes]
      properties:
        mode: {type: string, enum: [country, city]}
        city_enabled: {type: boolean}
        auto_update: {type: boolean}
        asn: {$ref: "#/components/schemas/IPDatabaseDataset"}
        country: {$ref: "#/components/schemas/IPDatabaseDataset"}
        city:
          type: object
          nullable: true
          allOf: [{$ref: "#/components/schemas/IPDatabaseDataset"}]
        last_check_at: {type: string, format: date-time, nullable: true}
        last_update_at: {type: string, format: date-time, nullable: true}
        last_error:
          type: object
          nullable: true
          properties:
            code: {type: string}
            message: {type: string}
        attribution:
          type: array
          items:
            type: object
            required: [name, url, license, license_url]
            properties:
              name: {type: string}
              url: {type: string, format: uri}
              license: {type: string}
              license_url: {type: string, format: uri}
        go_heap_alloc_bytes: {type: integer, format: int64, description: Current total Go heap; excludes mmap.}
        process_peak_rss_bytes: {type: integer, format: int64, nullable: true, description: OS peak process resident memory; not component-only or current RSS. Null if unavailable.}
        mapped_file_bytes: {type: integer, format: int64, description: Total sizes of mapped dataset files; not a resident-memory measurement.}
    TraceScheduleInput:
      type: object
      additionalProperties: false
      required: [revision, enabled, notify_changes]
      properties:
        revision: {type: integer, format: int64, minimum: 0}
        enabled: {type: boolean}
        notify_changes: {type: boolean, description: Explicit opt-in to change events; also requires the global network_route_change rule. No recovery event is invented.}
        time_of_day: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', default: '03:00'}
        max_hops: {type: integer, minimum: 1, maximum: 30, default: 30}
        count: {type: integer, minimum: 1, maximum: 5, default: 3}
        timeout_ms: {type: integer, minimum: 100, maximum: 2000, default: 1000}
      description: Same total packet budget as a manual TraceSubmission. A daily civil time uses its first occurrence; when absent at a timezone transition use the first valid minute after it. Never run twice in a repeated hour.
    TraceSchedule:
      type: object
      required: [plan_id, revision, enabled, notify_changes, time_of_day, max_hops, count, timeout_ms, active, timezone, updated_at, next_run_at]
      properties:
        plan_id: {type: string}
        revision: {type: integer, format: int64}
        enabled: {type: boolean}
        notify_changes: {type: boolean}
        time_of_day: {type: string}
        max_hops: {type: integer}
        count: {type: integer}
        timeout_ms: {type: integer}
        active: {type: boolean}
        timezone: {type: string}
        updated_at: {type: string, format: date-time, nullable: true}
        next_run_at: {type: string, format: date-time, nullable: true}
    TraceSnapshot:
      type: object
      required: [id, plan_id, plan_name, plan_revision, schedule_revision, target_id, target_revision, due_at, created_at, updated_at, status, skip_reason, trace_id, job_id, notify_changes, comparison]
      properties:
        id: {type: string}
        plan_id: {type: string}
        plan_name: {type: string, description: Frozen at scheduling.}
        plan_revision: {type: integer, format: int64}
        schedule_revision: {type: integer, format: int64}
        target_id: {type: string}
        target_revision: {type: integer, format: int64}
        due_at: {type: string, format: date-time, description: Original due opportunity; not a fabricated measurement timestamp.}
        created_at: {type: string, format: date-time, description: Actual scheduling time.}
        updated_at: {type: string, format: date-time}
        status: {type: string, enum: [queued, running, succeeded, failed, skipped]}
        skip_reason: {type: string, nullable: true}
        trace_id: {type: string, nullable: true, description: Read raw result/enrichment/export through the existing trace endpoints.}
        job_id: {type: string, nullable: true}
        notify_changes: {type: boolean, description: Frozen opt-in when this opportunity was created.}
        comparison: {$ref: "#/components/schemas/TraceComparison"}
    TraceComparison:
      type: object
      required: [status, reason, previous_snapshot_id, previous_trace_id, address, previous_address, asns, previous_asns, asn_database, previous_asn_database, notification_id]
      properties:
        status: {type: string, enum: [waiting_result, waiting_enrichment, baseline, unchanged, changed, not_comparable]}
        reason: {type: string, nullable: true, description: "Stable reason: first_snapshot, snapshot_skipped, measurement_failed, enrichment_unavailable, incomplete_responses, unknown_asn, multiple_asns, previous_not_comparable, configuration_changed, target_changed, asn_database_changed, or backup_restored."}
        previous_snapshot_id: {type: string, nullable: true}
        previous_trace_id: {type: string, nullable: true}
        address: {type: string, nullable: true}
        previous_address: {type: string, nullable: true}
        asns: {type: array, items: {type: integer, format: int64}, description: Complete observed-IP ASN sequence with adjacent equal values coalesced; never claimed as BGP AS path. Empty if evidence is insufficient.}
        previous_asns: {type: array, items: {type: integer, format: int64}}
        asn_database:
          type: object
          nullable: true
          allOf: [{$ref: "#/components/schemas/IPDatabaseDataset"}]
        previous_asn_database:
          type: object
          nullable: true
          allOf: [{$ref: "#/components/schemas/IPDatabaseDataset"}]
        notification_id: {type: string, nullable: true, description: Linked event record when current settings authorize it; not proof of delivery. Stale completed observations are recorded without new delivery.}
    TraceCapability:
      type: object
      required: [available, unavailable_reason, methods, last_poll_at]
      description: Separate trace protocol evidence for the current token, requiring fresh agent traffic and trace polling. Methods describe implementation support, not verified raw socket permission or reachability. Server TCP tracing currently requires Linux. Server last_poll_at is null.
      properties:
        available: {type: boolean}
        unavailable_reason: {type: string, nullable: true}
        methods: {type: array, items: {type: string, enum: [icmp, tcp]}}
        last_poll_at: {type: string, format: date-time, nullable: true}
    DuplexTraceSubmission:
      type: object
      additionalProperties: false
      required: [request_key, from_instance_id, to_instance_id, family, method, forward_port, reverse_port]
      properties:
        request_key: {type: string, pattern: '^[A-Za-z0-9_-]{16,128}$'}
        from_instance_id: {type: string, minLength: 1, maxLength: 128}
        to_instance_id: {type: string, minLength: 1, maxLength: 128}
        family: {type: string, enum: [ipv4, ipv6]}
        method: {type: string, enum: [icmp, tcp]}
        forward_port: {type: integer, minimum: 0, maximum: 65535, description: Destination port on to_instance_id; zero for ICMP.}
        reverse_port: {type: integer, minimum: 0, maximum: 65535, description: Destination port on from_instance_id; zero for ICMP.}
        max_hops: {type: integer, minimum: 1, maximum: 30, default: 30}
        count: {type: integer, minimum: 1, maximum: 5, default: 3}
        timeout_ms: {type: integer, minimum: 100, maximum: 2000, default: 1000}
      description: Per-leg packet/DNS budget matches TraceSubmission. Public addresses must be different. TCP requires both ports 1–65535; endpoints can use different ports.
    DuplexTraceAccepted:
      type: object
      required: [duplex_id, forward, reverse]
      properties:
        duplex_id: {type: string}
        forward:
          type: object
          required: [job_id, trace_id]
          properties:
            job_id: {type: string}
            trace_id: {type: string}
        reverse:
          type: object
          required: [job_id, trace_id]
          properties:
            job_id: {type: string}
            trace_id: {type: string}
    DuplexTraceEndpoint:
      type: object
      required: [instance_id, name, kind, public_address, observed_at]
      properties:
        instance_id: {type: string}
        name: {type: string}
        kind: {type: string, enum: [ecs, swas]}
        public_address: {type: string, description: Pinned unique address from cached discovery; never updated in this historical snapshot.}
        observed_at: {type: string, format: date-time}
    DuplexTrace:
      type: object
      required: [id, created_at, from, to, forward, reverse]
      properties:
        id: {type: string}
        created_at: {type: string, format: date-time}
        from: {$ref: "#/components/schemas/DuplexTraceEndpoint"}
        to: {$ref: "#/components/schemas/DuplexTraceEndpoint"}
        forward: {$ref: "#/components/schemas/TraceDetail"}
        reverse: {$ref: "#/components/schemas/TraceDetail"}
    TraceSubmission:
      type: object
      additionalProperties: false
      required: [request_key, point_kind, instance_id, target_id, target_revision, host, family, method, port]
      properties:
        request_key: {type: string, pattern: '^[A-Za-z0-9_-]{16,128}$'}
        point_kind: {type: string, enum: [server, agent]}
        instance_id: {type: string, nullable: true, description: Required for agent; null for server.}
        target_id: {type: string, nullable: true}
        target_revision: {type: integer, format: int64, minimum: 1, nullable: true}
        host: {type: string, nullable: true, maxLength: 253, description: Public IP or hostname only; null when using target_id.}
        family: {type: string, enum: [ipv4, ipv6]}
        method: {type: string, enum: [icmp, tcp]}
        port: {type: integer, minimum: 0, maximum: 65535, description: Zero for ICMP; 1–65535 for TCP.}
        max_hops: {type: integer, minimum: 1, maximum: 30, default: 30}
        count: {type: integer, minimum: 1, maximum: 5, default: 3}
        timeout_ms: {type: integer, minimum: 100, maximum: 2000, default: 1000}
      description: Exactly one target_id+target_revision or host. Max_hops × count × timeout_ms plus fixed 100ms gaps must not exceed 120 seconds. DNS has a five-second budget and pins one checked public address. Demo submission remains read-only (501).
    TraceRequest:
      type: object
      required: [host, family, method, port, max_hops, count, timeout_ms]
      properties:
        host: {type: string}
        family: {type: string, enum: [ipv4, ipv6]}
        method: {type: string, enum: [icmp, tcp]}
        port: {type: integer}
        max_hops: {type: integer}
        count: {type: integer}
        timeout_ms: {type: integer}
    TraceOutcome:
      type: object
      required: [started_at, finished_at, address, reached, stop_reason, hop_count, sample_count]
      properties:
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        address: {type: string, description: Empty when failed before address selection.}
        reached: {type: boolean, description: At least one matching target reply; TCP reset does not imply service availability.}
        stop_reason: {type: string, enum: [reached, unreachable, max_hops, incomplete]}
        hop_count: {type: integer}
        sample_count: {type: integer}
    TraceRun:
      type: object
      required: [id, job_id, point_id, point_name, point_kind, instance_id, target, request, created_at, updated_at, status, outcome, error, enrichment_status, duplex_id, duplex_direction]
      properties:
        id: {type: string}
        job_id: {type: string}
        point_id: {type: string}
        point_name: {type: string, description: Source name at submission.}
        point_kind: {type: string, enum: [server, agent]}
        instance_id: {type: string, nullable: true}
        target:
          type: object
          nullable: true
          description: Saved target snapshot at submission; null for direct host.
          allOf: [{$ref: "#/components/schemas/NetworkTarget"}]
        request: {$ref: "#/components/schemas/TraceRequest"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        status: {type: string, enum: [queued, running, succeeded, failed], description: "succeeded means complete execution; connectivity is described by outcome."}
        enrichment_status: {type: string, enum: [waiting_result, not_available, queued, running, complete, partial, failed], description: Independent background processing. Complete can include missing database coverage or absent PTR; partial means a lookup failed or timed out. No lookups are started by a GET.}
        duplex_id: {type: string, nullable: true, description: Backlink to a paired query; null for ordinary manual/scheduled traces.}
        duplex_direction: {type: string, nullable: true, enum: [forward, reverse, null]}
        outcome:
          type: object
          nullable: true
          allOf: [{$ref: "#/components/schemas/TraceOutcome"}]
        error:
          type: object
          nullable: true
          properties:
            code: {type: string}
            message: {type: string}
    TraceDetail:
      allOf:
        - $ref: "#/components/schemas/TraceRun"
        - type: object
          required: [result, enrichment, enrichment_error]
          properties:
            enrichment:
              type: object
              nullable: true
              allOf: [{$ref: "#/components/schemas/TraceEnrichment"}]
            enrichment_error:
              type: object
              nullable: true
              properties:
                code: {type: string}
                message: {type: string}
            result:
              type: object
              nullable: true
              allOf: [{$ref: "#/components/schemas/TraceResult"}]
    TraceEnrichment:
      type: object
      required: [enriched_at, status, asn_database, location_database, addresses, hops, labels, detour_status, attribution]
      description: Frozen at enrichment time, not silently rewritten by database updates. IP ownership/geolocation and PTR do not prove the forwarding path, physical location or verified host identity. Only observed responding addresses are enriched. Hop candidate sets preserve multipath and gaps instead of claiming a unique BGP AS path.
      properties:
        enriched_at: {type: string, format: date-time}
        status: {type: string, enum: [complete, partial]}
        asn_database:
          type: object
          nullable: true
          allOf: [{$ref: "#/components/schemas/IPDatabaseDataset"}]
        location_database:
          type: object
          nullable: true
          allOf: [{$ref: "#/components/schemas/IPDatabaseDataset"}]
        addresses:
          type: array
          maxItems: 150
          items: {$ref: "#/components/schemas/TraceAddressInfo"}
        hops:
          type: array
          maxItems: 30
          items: {$ref: "#/components/schemas/TraceHopInfo"}
        labels:
          type: array
          items: {$ref: "#/components/schemas/TraceNetworkLabel"}
        detour_status: {type: string, enum: [unconfirmed], description: Estimated location sequence alone cannot establish detour.}
        attribution:
          type: array
          description: Show the DB-IP attribution link wherever these data are displayed; retain it in exports.
          items:
            type: object
            required: [name, url, license, license_url]
            properties:
              name: {type: string}
              url: {type: string, format: uri}
              license: {type: string}
              license_url: {type: string, format: uri}
    TraceAddressInfo:
      type: object
      required: [address, asn, location, asn_status, location_status, ptr]
      properties:
        address: {type: string}
        asn_status: {type: string, enum: [ok, not_found, not_public, unavailable]}
        location_status: {type: string, enum: [ok, not_found, not_public, unavailable]}
        asn:
          type: object
          nullable: true
          required: [number, organization, prefix, dataset]
          properties:
            number: {type: integer, format: int64, minimum: 1}
            organization: {type: string, nullable: true}
            prefix: {type: string, description: Matched offline database network.}
            dataset: {$ref: "#/components/schemas/IPDatabaseDataset"}
        location:
          type: object
          nullable: true
          required: [country_code, country_name, region, city, latitude, longitude, prefix, granularity, dataset]
          properties:
            country_code: {type: string, nullable: true}
            country_name: {type: string, nullable: true}
            region: {type: string, nullable: true}
            city: {type: string, nullable: true}
            latitude: {type: number, nullable: true}
            longitude: {type: number, nullable: true}
            prefix: {type: string}
            granularity: {type: string, enum: [country, city]}
            dataset: {$ref: "#/components/schemas/IPDatabaseDataset"}
        ptr:
          type: object
          required: [status, names, truncated]
          properties:
            status: {type: string, enum: [ok, not_found, not_public, timeout, unavailable, invalid_response]}
            names: {type: array, maxItems: 8, items: {type: string, maxLength: 253}}
            truncated: {type: boolean}
    TraceHopInfo:
      type: object
      required: [ttl, attempts, responses, no_response_percent, minimum_ms, maximum_ms, average_ms, addresses, asn_candidates, unknown_asn, country_codes, unknown_location]
      properties:
        ttl: {type: integer}
        attempts: {type: integer, description: "Actually recorded attempts, including timeouts; never fabricate missing attempts."}
        responses: {type: integer}
        no_response_percent: {type: number, nullable: true, description: Fraction of recorded attempts without a response; not forwarding packet loss. Null when no attempts were recorded.}
        minimum_ms: {type: number, nullable: true}
        maximum_ms: {type: number, nullable: true}
        average_ms: {type: number, nullable: true}
        addresses: {type: array, items: {type: string}}
        asn_candidates: {type: array, items: {type: integer, format: int64}}
        unknown_asn: {type: boolean, description: Any unanswered attempt or response lacking ASN coverage; also true for a TTL without recorded attempts.}
        country_codes: {type: array, items: {type: string}}
        unknown_location: {type: boolean}
    TraceNetworkLabel:
      type: object
      required: [code, asn, addresses, ttls, service_tier, cross_border, reference_url]
      properties:
        code: {type: string, enum: [cn2, chinanet_163, cu_9929, cu_4837, cmi, alibaba_network]}
        asn: {type: integer, format: int64}
        addresses: {type: array, items: {type: string}, description: Responding IPs actually assigned this ASN by the frozen database. No prefix guesses.}
        ttls: {type: array, items: {type: integer}}
        service_tier: {type: string, nullable: true, enum: [unconfirmed, null], description: CN2 GIA/GT remains unconfirmed; null for other networks.}
        cross_border: {type: string, nullable: true, enum: [unconfirmed, null], description: Alibaba cross-border use remains unconfirmed; null for other networks.}
        reference_url: {type: string, format: uri, description: "ASN registry reference for the label, not a live lookup or route verification."}
    TraceResult:
      type: object
      required: [started_at, finished_at, address, resolved_addresses, hops, reached, stop_reason]
      properties:
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        address: {type: string}
        resolved_addresses: {type: array, items: {type: string}}
        reached: {type: boolean}
        stop_reason: {type: string, enum: [reached, unreachable, max_hops, incomplete]}
        hops:
          type: array
          maxItems: 30
          items:
            type: object
            required: [ttl, samples]
            properties:
              ttl: {type: integer, minimum: 1, maximum: 30}
              samples:
                type: array
                maxItems: 5
                items:
                  type: object
                  required: [sequence, started_at, address, rtt_ms, reply, icmp_type, icmp_code, error_code]
                  properties:
                    sequence: {type: integer}
                    started_at: {type: string, format: date-time}
                    address: {type: string, nullable: true, description: Responding router; can be private. Not a new probe target.}
                    rtt_ms: {type: number, nullable: true, minimum: 0}
                    reply: {type: string, nullable: true, enum: [echo_reply, tcp_syn_ack, tcp_reset, time_exceeded, destination_unreachable, packet_too_big, parameter_problem, null]}
                    icmp_type: {type: integer, nullable: true}
                    icmp_code: {type: integer, nullable: true}
                    error_code: {type: string, nullable: true, description: probe_timeout means no observed response; never assume intermediate forwarding loss.}
    ProbeRun:
      type: object
      required: [id, plan_id, plan_revision, target_id, target_revision, point_kind, instance_id, created_at, updated_at, status, skip_reason, job_id, request, result, error]
      properties:
        id: {type: string}
        plan_id: {type: string}
        plan_revision: {type: integer, format: int64}
        target_id: {type: string}
        target_revision: {type: integer, format: int64}
        point_kind: {type: string, enum: [server, agent]}
        instance_id: {type: string, nullable: true}
        created_at: {type: string, format: date-time, description: "Current scheduling attempt, never a fabricated missed-period sample."}
        updated_at: {type: string, format: date-time}
        status: {type: string, enum: [queued, running, succeeded, failed, skipped], description: "succeeded means measurement completed; inspect summary loss_percent for reachability."}
        skip_reason: {type: string, nullable: true, description: "Stable reason such as target_disabled, target_discovery_incomplete, target_discovery_stale, target_no_public_address, target_ambiguous_address, agent_offline, previous_run_pending or probe_queue_full. No RTT is fabricated for skips."}
        job_id: {type: string, nullable: true}
        request:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ProbeRequest"
        result:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ProbeResult"
        error:
          type: object
          nullable: true
          properties:
            code: {type: string}
            message: {type: string}

    ProbeRequest:
      type: object
      required: [host, family, method, port, count, timeout_ms, interval_ms]
      properties:
        host: {type: string}
        family: {type: string, enum: [ipv4, ipv6]}
        method: {type: string, enum: [icmp, tcp]}
        port: {type: integer, description: Zero for ICMP; explicit destination port for TCP.}
        count: {type: integer}
        timeout_ms: {type: integer}
        interval_ms: {type: integer}
    ProbeResult:
      type: object
      required: [started_at, finished_at, address, resolved_addresses, samples, summary]
      properties:
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        address: {type: string, description: Selected address; empty if execution failed before resolution.}
        resolved_addresses:
          type: array
          items: {type: string}
        samples:
          type: array
          items:
            type: object
            required: [sequence, started_at, rtt_ms, error_code]
            properties:
              sequence: {type: integer}
              started_at: {type: string, format: date-time}
              rtt_ms: {type: number, nullable: true, minimum: 0}
              error_code: {type: string, nullable: true}
        summary:
          type: object
          nullable: true
          description: Recomputed from raw attempts. Local failure has no summary; complete 100% failure has null RTT statistics. Jitter uses only adjacent successful samples, never across failures. TCP loss_percent is failed connection attempts, not measured IP packet loss.
          required: [attempts, succeeded, loss_percent, minimum_ms, maximum_ms, average_ms, jitter_ms]
          properties:
            attempts: {type: integer}
            succeeded: {type: integer}
            loss_percent: {type: number, minimum: 0, maximum: 100}
            minimum_ms: {type: number, nullable: true}
            maximum_ms: {type: number, nullable: true}
            average_ms: {type: number, nullable: true}
            jitter_ms: {type: number, nullable: true}

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: |
                稳定的错误码。M1 已知取值：unauthenticated、forbidden、csrf_failed、not_found、validation_failed、
                rate_limited、internal_error、invalid_setup_token、already_initialized、invalid_credentials、
                account_name_taken、access_key_invalid、agent_not_supported、telegram_not_configured、
                telegram_unauthorized、telegram_chat_not_found、telegram_unreachable、aliyun_unreachable。
            message:
              type: string
              description: 给开发者看的英文说明；界面文案由前端按 code 决定。
            fields:
              type: object
              description: 字段名 -> 错误码（required、too_short、invalid_format、out_of_range 等）。
              additionalProperties:
                type: string
            retry_after_seconds:
              type: integer

    JobAccepted:
      type: object
      required: [job_id]
      properties:
        job_id:
          type: string

    JobType:
      type: string
      description: network_probe 包含固定测速及线路追踪任务。
      enum: [refresh, permission_check, telegram_test, instance_power, heartbeat_test, network_probe]

    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed]

    JobTrigger:
      type: string
      enum: [panel, cli, api, telegram, schedule, system, unknown]

    Job:
      type: object
      required: [id, type, status, created_at, started_at, finished_at, error, result]
      properties:
        id:
          type: string
        type:
          $ref: "#/components/schemas/JobType"
        account_ids:
          type: array
          description: Account scope captured at enqueue time; an empty list means this task has no account target.
          items:
            type: string
        instance_id:
          type: string
          nullable: true
          description: Specific instance target, or null for current collection and Telegram-test tasks. Never inferred from scope strings.
        trigger:
          $ref: "#/components/schemas/JobTrigger"
        status:
          $ref: "#/components/schemas/JobStatus"
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        error:
          type: object
          nullable: true
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
        result:
          type: object
          nullable: true
          description: |
            成功时的结果，结构取决于 type：`permission_check` 为 PermissionCheck；
            `refresh`、`telegram_test`、`heartbeat_test`、`network_probe` 为 null；测速结果见 `/network/plans/{id}/runs`，线路追踪详情见 `/network/traces/{id}`。
            `instance_power` 为 PowerJobResult（任务未完成时也保留请求与执行阶段）。
          additionalProperties: true

    PowerJobResult:
      type: object
      required: [action, stop_mode, dispatch_outcome]
      properties:
        action:
          type: string
          enum: [start, stop, reboot]
        stop_mode:
          type: string
          nullable: true
          enum: [keep_charging, stop_charging, null]
          description: Required only for ECS stop; null for other operations.
        dispatch_outcome:
          type: string
          enum: [not_sent, dispatching, accepted, rejected, unknown]
          description: Acceptance is not proof of the final instance state. Unknown outcomes must not be automatically replayed.

        baseline:
          type: object
          allOf:
            - $ref: "#/components/schemas/PowerObservation"
          nullable: true
        observation:
          type: object
          allOf:
            - $ref: "#/components/schemas/PowerObservation"
          nullable: true
        confirmation_basis:
          type: string
          nullable: true
          enum: [target_state, start_time_changed, state_transition, null]

    PowerObservation:
      type: object
      required: [status, stopped_mode, started_at, observed_at]
      properties:
        status:
          type: string
          enum: [pending, starting, running, stopping, stopped, resetting, upgrading, disabled]
        stopped_mode:
          type: string
          nullable: true
          enum: [keep_charging, stop_charging, not_applicable, null]
          description: ECS observation only. Null means unavailable, never inferred from the requested mode.
        started_at:
          type: string
          format: date-time
          nullable: true
          description: ECS most recent start time when supplied; the provider may only resolve minutes. SWAS has no verified equivalent.
        observed_at:
          type: string
          format: date-time

    SetupStatus:
      type: object
      required: [initialized, password_min_length]
      properties:
        initialized:
          type: boolean
        password_min_length:
          type: integer

    SetupRequest:
      type: object
      required: [setup_token, password]
      properties:
        setup_token:
          type: string
          description: 运维通过 HM_SETUP_TOKEN 或 HM_SETUP_TOKEN_FILE 提供的初始化凭证；不从日志读取。
        password:
          type: string
          description: 12–1024 UTF-8 字节。
        business_timezone:
          type: string
          description: IANA 时区名，默认 Asia/Shanghai。

    LoginRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string

    EmptyObject:
      type: object
      additionalProperties: false
    PasskeyRegistrationBegin:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: 去除首尾空白后为 1–80 UTF-8 字节。
    PasskeyFinish:
      type: object
      additionalProperties: false
      required: [ceremony_id, credential]
      properties:
        ceremony_id: {type: string, pattern: '^[a-f0-9]{64}$'}
        credential:
          type: object
          additionalProperties: true
          description: 浏览器 PublicKeyCredential.toJSON() 或等价序列化；二进制字段为无填充 base64url。注册含 attestationObject/clientDataJSON；登录含 authenticatorData/clientDataJSON/signature/userHandle。整个请求上限 16 KiB。
    PasskeyOptions:
      type: object
      required: [ceremony_id, expires_at, options]
      properties:
        ceremony_id: {type: string}
        expires_at: {type: string, format: date-time}
        options:
          type: object
          additionalProperties: true
          required: [publicKey]
          properties:
            publicKey:
              type: object
              additionalProperties: true
              description: WebAuthn JSON options；用 parseCreationOptionsFromJSON 或 parseRequestOptionsFromJSON 转换后传入 navigator.credentials。旧浏览器须自行还原 ArrayBuffer。
    Passkey:
      type: object
      required: [id, name, created_at, last_used_at]
      properties:
        id: {type: string}
        name: {type: string}
        created_at: {type: string, format: date-time}
        last_used_at: {type: string, nullable: true, format: date-time}

    Session:
      type: object
      required: [csrf_token, expires_at]
      properties:
        csrf_token:
          type: string
        expires_at:
          type: string
          format: date-time

    SystemInfo:
      type: object
      required: [version, commit, built_at, latest_agent_version, data_mode, read_only]
      properties:
        data_mode:
          type: string
          enum: [demo, live]
          description: Whether the returned application data is synthetic or from live sources.
        read_only:
          type: boolean
          description: Resource/configuration mutations are unavailable; session login/logout remain available.
        instance_power_enabled:
          type: boolean
          description: Whether this server accepts manual power jobs. Independent of configuration-write availability; false by default and in demo mode.
        version:
          type: string
        commit:
          type: string
        built_at:
          type: string
          format: date-time
          nullable: true
          description: Null when the binary has no build timestamp.
        latest_agent_version:
          type: string
          nullable: true
          description: Verified local agent release version, using the same cache as Agent.available_version. Null when unavailable. Use Agent.update_available for upgrade decisions, not string inequality against this field.

    Settings:
      type: object
      required: [business_timezone, collection]
      properties:
        business_timezone:
          type: string
          description: IANA 时区名，面板按它显示时间、切分"今天"。
        collection:
          type: object
          description: 采集周期，只读，用于在界面上解释数据有多新。
          required: [cdt_poll_interval_seconds, agent_report_interval_seconds, agent_offline_after_seconds, resource_scan_interval_seconds]
          properties:
            system_event_poll_interval_seconds:
              type: integer
              description: Independent event polling interval; default 60 seconds. Queueing and provider latency can delay observation.
            cdt_poll_interval_seconds:
              type: integer
            agent_report_interval_seconds:
              type: integer
              description: Default agent sampling interval (10 seconds). Individual agents may override it locally; see Agent.report_interval_seconds.
            agent_offline_after_seconds:
              type: integer
            resource_scan_interval_seconds:
              type: integer

    SettingsUpdate:
      type: object
      properties:
        business_timezone:
          type: string

    AccountSite:
      type: string
      enum: [china, international]
      description: china = 国内站；international = 国际站。

    Region:
      type: object
      required: [id, mainland]
      properties:
        id:
          type: string
          description: 阿里云地域 ID，如 cn-hongkong。中文名由前端维护。
        mainland:
          type: boolean
          description: 是否属于中国内地（决定计入国内还是海外额度）。

    PermissionKey:
      type: string
      enum: [ecs_read, swas_read, cdt_read, cms_read, instance_power, vpc_read, eip_manage, bss_read]

    PermissionResult:
      type: string
      enum: [passed, missing, not_verified, check_failed]
      description: 通过 / 缺少权限 / 未验证 / 检查失败（PRD F1.2）。

    PermissionCheck:
      type: object
      required: [checked_at, items]
      properties:
        checked_at:
          type: string
          format: date-time
        items:
          type: array
          items:
            type: object
            required: [key, result]
            properties:
              key:
                $ref: "#/components/schemas/PermissionKey"
              result:
                $ref: "#/components/schemas/PermissionResult"

    AccountSyncStatus:
      type: string
      enum: [never_synced, ok, failing]
      description: failing = 接口连续调用失败（PRD F11.4）。

    Account:
      type: object
      required:
        - id
        - name
        - site
        - access_key_id_masked
        - region_ids
        - enabled
        - quota_mainland_bytes
        - quota_overseas_bytes
        - reset_day
        - alert_thresholds_percent
        - sync_status
        - last_sync_at
        - last_error
        - consecutive_failures
        - permission_check
        - instance_count
        - updated_at
      properties:
        id:
          type: string
        name:
          type: string
        site:
          $ref: "#/components/schemas/AccountSite"
        access_key_id_masked:
          type: string
          description: 打码后的 AccessKey ID，如 LTAI5t…pgu。Secret 永不返回。
        region_ids:
          type: array
          description: 要扫描的地域。
          items:
            type: string
        enabled:
          type: boolean
        quota_mainland_bytes:
          type: integer
          format: int64
        quota_overseas_bytes:
          type: integer
          format: int64
        reset_day:
          type: integer
          enum: [1]
          description: CDT calendar-month reset; custom budget cycles are separate.
        alert_thresholds_percent:
          type: array
          description: 用量告警档位，升序，如 [80, 90, 95]。
          items:
            type: integer
        sync_status:
          $ref: "#/components/schemas/AccountSyncStatus"
        last_sync_at:
          type: string
          format: date-time
          nullable: true
        last_error:
          type: object
          nullable: true
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
        consecutive_failures:
          type: integer
        permission_check:
          type: object
          allOf:
            - $ref: "#/components/schemas/PermissionCheck"
          nullable: true
        instance_count:
          type: integer
        updated_at:
          type: string
          format: date-time

    AccountCreate:
      type: object
      required: [name, site, access_key_id, access_key_secret, region_ids]
      properties:
        name:
          type: string
        site:
          $ref: "#/components/schemas/AccountSite"
        access_key_id:
          type: string
        access_key_secret:
          type: string
        region_ids:
          type: array
          items:
            type: string
        quota_mainland_bytes:
          type: integer
          format: int64
        quota_overseas_bytes:
          type: integer
          format: int64
        reset_day:
          type: integer
          enum: [1]
        alert_thresholds_percent:
          type: array
          items:
            type: integer

    AccountUpdate:
      type: object
      description: 只传要改的字段。access_key_id 与 access_key_secret 必须同时传或同时不传。
      properties:
        name:
          type: string
        access_key_id:
          type: string
        access_key_secret:
          type: string
        region_ids:
          type: array
          items:
            type: string
        enabled:
          type: boolean
        quota_mainland_bytes:
          type: integer
          format: int64
        quota_overseas_bytes:
          type: integer
          format: int64
        reset_day:
          type: integer
          enum: [1]
        alert_thresholds_percent:
          type: array
          items:
            type: integer

    InstanceKind:
      type: string
      enum: [ecs, swas]
      description: ecs = 云服务器 ECS；swas = 轻量应用服务器。

    InstanceStatus:
      type: string
      enum: [pending, starting, running, stopping, stopped, unknown]

    ChargeType:
      type: string
      enum: [subscription, pay_as_you_go, spot, unknown]
      description: 包年包月 / 按量付费 / 抢占式。

    PublicIpType:
      type: string
      enum: [instance_public_ip, eip]

    BillingSubjectKind:
      type: string
      enum:
        - unknown
        - ecs_pay_by_traffic
        - eip_pay_by_traffic
        - eip_fixed_bandwidth
        - cbwp_dominant_traffic
        - cbwp_bandwidth
        - cbwp_95
        - ecs_fixed_bandwidth
        - swas_traffic_package
        - swas_no_traffic_package
      description: 计费对象类型，对应 PRD 6.1 的表格。cbwp = 共享带宽。

    MeteringRule:
      type: string
      enum: [outbound_only, max_in_out_per_period, plan_defined, not_metered, unknown]
      description: 只算出方向 / 每个计费周期取入、出较大值 / 按套餐规则 / 不按流量计费。

    QuotaScope:
      type: string
      enum: [mainland, overseas]
      description: mainland = 中国内地额度；overseas = 非中国内地额度。

    AgentStatus:
      type: string
      enum: [not_installed, online, offline]

    RealtimeProtection:
      type: string
      enum: [protected, worst_case, unprotected, not_applicable]
      description: |
        - protected：CDT 归属、官方基准和计量口径已确认，agent 数据可用，实时估算包含这台实例。
        - worst_case：计入 CDT，agent 掉线且实例仍在运行，正按最坏情况推算（PRD 6.2）。
        - unprotected：计入 CDT，但缺少 agent 数据、官方截止时间或其他有效计量依据。不能仅由此状态推断没有安装 agent；应结合 Agent.status 解释原因。
        - not_applicable：不计入 CDT（固定带宽、轻量等），不需要实时保护。

    WorstCaseBasis:
      type: string
      enum: [recent_peak, bandwidth_cap]
      description: 掉线前一段时间的峰值速率 / 带宽上限。

    Agent:
      type: object
      required: [status, version, registered_at, last_report_at, offline_since, worst_case]
      properties:
        available_version:
          type: string
          nullable: true
          description: Version of the server's locally configured and validated agent release, not a check against an upstream release service. Null if release files are unavailable or invalid.
        update_available:
          type: boolean
          nullable: true
          description: True when the installed semantic version is older than available_version. Null for dev/unknown versions or missing installation/release. Build metadata does not affect precedence. Use POST install-command for an explicit upgrade command; no automatic installation occurs.
        report_interval_seconds:
          type: integer
          nullable: true
          minimum: 1
          maximum: 60
          description: Latest declared sampling interval; null before a fresh report in the current registration or after revocation. This does not change the separately configured offline alert timeout.
        pending_first_report:
          type: boolean
          description: Registered but no fresh sample received; status remains offline until the first fresh report. Do not interpret registration as online.
        data_quality:
          type: string
          nullable: true
          enum: [baseline, ok, clock_skew, counter_reset, stale, gap, null]
          description: Latest stored sample quality; absent samples or revoked tokens produce null. Online does not imply aligned CDT protection.
        status:
          $ref: "#/components/schemas/AgentStatus"
        version:
          type: string
          nullable: true
        registered_at:
          type: string
          format: date-time
          nullable: true
        last_report_at:
          type: string
          format: date-time
          nullable: true
        offline_since:
          type: string
          format: date-time
          nullable: true
        worst_case:
          type: object
          nullable: true
          description: 仅在按最坏情况推算时非空。
          required: [basis, rate_bytes_per_second, accumulated_bytes]
          properties:
            basis:
              $ref: "#/components/schemas/WorstCaseBasis"
            rate_bytes_per_second:
              type: integer
              format: int64
            accumulated_bytes:
              type: integer
              format: int64
              description: 掉线以来按推算速率累计的字节数。

    InstanceRealtime:
      type: object
      required: [rx_bytes_per_second, tx_bytes_per_second, sampled_at]
      properties:
        rx_bytes_per_second:
          type: integer
          format: int64
          description: 公网入方向速率。
        tx_bytes_per_second:
          type: integer
          format: int64
          description: 公网出方向速率。
        sampled_at:
          type: string
          format: date-time

    RAMPolicyDraft:
      type: object
      required: [id, reviewed_on, verification, cloud_write_permissions, limitations, document]
      properties:
        id:
          type: string
          enum: [readonly, instance_power, resource_management]
        reviewed_on:
          type: string
          format: date
        verification:
          type: string
          enum: [draft]
        cloud_write_permissions:
          type: boolean
        limitations:
          type: array
          items:
            type: string
            enum: [cdt_action_unverified, public_metadata_actions_unverified, resource_scope_not_account_bound, runtime_writes_unimplemented, creation_dependencies_pending]
        document:
          type: object
          required: [Version, Statement]
          properties:
            Version:
              type: string
              enum: ["1"]
            Statement:
              type: array
              items:
                type: object
                required: [Effect, Action, Resource]
                properties:
                  Effect:
                    type: string
                    enum: [Allow]
                  Action:
                    type: array
                    items:
                      type: string
                  Resource:
                    type: string
                    description: RAM ARN pattern or '*'. Template patterns are not yet narrowed to the user's account or individual resources.

    InstanceEventValue:
      type: object
      description: Exactly one field according to event kind. Lifecycle events use present, status changes use status, address changes use addresses. Address arrays are normalized sets, not interface ordering; an empty array is a confirmed empty set.
      properties:
        present:
          type: boolean
        status:
          $ref: "#/components/schemas/InstanceStatus"
        addresses:
          type: array
          items:
            type: string

    SystemEventSource:
      type: object
      required: [account_id, region_id, source, status, checked_at, last_success_at, last_error]
      properties:
        account_id:
          type: string
        region_id:
          type: string
        source:
          type: string
          enum: [ecs_history, cms_spot]
        status:
          type: string
          enum: [ok, stale, error, paused]
          description: Paused for disabled accounts/removed regions; stale after configuration changes or two polling intervals without a check; error for a recent failed query.
        checked_at:
          type: string
          format: date-time
        last_success_at:
          type: string
          format: date-time
          nullable: true
        last_error:
          type: object
          nullable: true
          properties:
            code:
              type: string
            message:
              type: string

    SystemEvent:
      type: object
      required: [id, account_id, region_id, source, instance_id, cloud_event_id, cloud_instance_id, category, event_type, event_type_code, provider_status, provider_status_code, published_at, not_before, finished_at, first_seen_at, observed_at, seen_in_latest_scan]
      properties:
        id:
          type: string
        account_id:
          type: string
        region_id:
          type: string
        source:
          type: string
          enum: [ecs_history, cms_spot]
        instance_id:
          type: string
          nullable: true
          description: Matched local ECS instance ID; null if inventory has not discovered or retained that resource.
        cloud_event_id:
          type: string
        cloud_instance_id:
          type: string
        category:
          type: string
          enum: [maintenance, spot_interruption, other]
        event_type:
          type: string
          description: Original provider event name.
        event_type_code:
          type: integer
          nullable: true
        provider_status:
          type: string
          description: Original event lifecycle/status, not the observed instance state.
        provider_status_code:
          type: integer
          nullable: true
        published_at:
          type: string
          format: date-time
          nullable: true
        not_before:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        first_seen_at:
          type: string
          format: date-time
        observed_at:
          type: string
          format: date-time
          description: Latest successful query that returned this event; failed queries never advance it.
        seen_in_latest_scan:
          type: boolean
          description: Presence in the last successful scan of this source. Consult source health; false does not imply resolution.

    InstanceEvent:
      type: object
      required: [id, account_id, instance_id, cloud_instance_id, instance_kind, region_id, instance_name, kind, observed_at, before, after]
      properties:
        id:
          type: string
        account_id:
          type: string
        instance_id:
          type: string
        cloud_instance_id:
          type: string
        instance_kind:
          $ref: "#/components/schemas/InstanceKind"
        region_id:
          type: string
        instance_name:
          type: string
          description: Name at observation time; retained for disappeared instances.
        kind:
          type: string
          enum: [discovered, disappeared, reappeared, status_changed, public_ipv4_changed, ipv6_changed]
        observed_at:
          type: string
          format: date-time
        before:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/InstanceEventValue"
          description: Null on first discovery. Existing data at feature rollout establishes a baseline without fabricating old changes.
        after:
          $ref: "#/components/schemas/InstanceEventValue"

    InstanceIPv6:
      type: object
      required: [addresses, status, source, checked_at, observed_at, last_error]
      properties:
        addresses:
          type: array
          uniqueItems: true
          items:
            type: string
            format: ipv6
          description: Normalized assigned addresses from primary and secondary ENIs, sorted and deduplicated. Empty with unknown status does not confirm absence. Delegated prefixes are not expanded into host addresses.
        status:
          type: string
          enum: [ok, stale, unknown]
          description: ok means the latest complete query succeeded; stale retains a previous successful result after failure; unknown means no successful result yet.
        source:
          type: string
          nullable: true
          enum: [ecs_instances, ecs_network_interfaces, null]
        checked_at:
          type: string
          format: date-time
          description: Time of the latest collection attempt.
        observed_at:
          type: string
          format: date-time
          nullable: true
          description: Time of the last successful complete observation; unchanged on failure.
        last_error:
          nullable: true
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string

    MaintenanceWindow:
      type: object
      additionalProperties: false
      required: [start_at, end_at]
      properties:
        start_at: {type: string, format: date-time}
        end_at: {type: string, format: date-time, description: 必须晚于 start_at。}
    QuietHours:
      type: object
      required: [revision, enabled, start, end, maintenance, timezone, updated_at, active, active_reason]
      properties:
        revision: {type: integer, format: int64}
        enabled: {type: boolean, description: 每日时段开关。}
        start: {type: string, example: '23:00'}
        end: {type: string, example: '08:00'}
        timezone: {type: string, description: 当前业务 IANA 时区，非本接口可写字段。}
        updated_at: {type: string, format: date-time, nullable: true}
        active: {type: boolean}
        active_reason: {type: string, nullable: true, enum: [daily, maintenance, null]}
        maintenance:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/MaintenanceWindow"

    HeartbeatSettings:
      type: object
      required: [enabled, url_configured, interval_seconds, revision, updated_at, last_attempt_at, last_success_at, last_error]
      properties:
        enabled: {type: boolean}
        url_configured: {type: boolean}
        interval_seconds: {type: integer, minimum: 15, maximum: 86400}
        revision: {type: integer, format: int64}
        updated_at: {type: string, format: date-time, nullable: true}
        last_attempt_at: {type: string, format: date-time, nullable: true, description: 最近一次尝试的开始时刻，包含健康门槛检查，并不表示网络请求已发送。}
        last_success_at: {type: string, format: date-time, nullable: true}
        last_error:
          type: object
          nullable: true
          properties:
            code: {type: string}
            message: {type: string}
          description: 固定错误码；不包含 URL、提供方响应正文或原始网络错误。成功仅表示健康门槛通过且 HTTP 为 2xx，不证明外部告警已送达。

    AgentNetworkSample:
      type: object
      required: [counter_epoch, sequence, sampled_at, received_at, uptime_ms, rx_bytes, tx_bytes, quality, rules_version, report_interval_seconds, dropped_samples, interval_status, interval_unavailable_reason, interval]
      properties:
        counter_epoch: {type: string}
        sequence: {type: integer, format: int64}
        sampled_at: {type: string, format: date-time}
        received_at: {type: string, format: date-time}
        uptime_ms: {type: integer, format: int64}
        rx_bytes: {type: integer, format: int64, minimum: 0, description: 当前代际累计入字节。}
        tx_bytes: {type: integer, format: int64, minimum: 0, description: 当前代际累计出字节。}
        quality: {type: string, enum: [baseline, ok, clock_skew, counter_reset, stale, gap, unknown]}
        rules_version: {type: string, nullable: true}
        report_interval_seconds: {type: integer, nullable: true}
        dropped_samples: {type: integer, format: int64, nullable: true}
        interval_status: {type: string, enum: [continuous, gap, unavailable]}
        interval_unavailable_reason:
          type: string
          nullable: true
          enum: [no_previous_sample, metadata_unknown, rules_changed, clock_skew, invalid_counter, rate_overflow, null]
        interval:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AgentNetworkInterval"
    AgentNetworkInterval:
      type: object
      required: [previous_sequence, start_at, end_at, duration_ms, rx_bytes, tx_bytes, rx_bytes_per_second, tx_bytes_per_second]
      properties:
        previous_sequence: {type: integer, format: int64}
        start_at: {type: string, format: date-time}
        end_at: {type: string, format: date-time}
        duration_ms: {type: integer, format: int64, description: 单调 uptime 差；不等同于墙钟时间差，不能据此假定小时分配。}
        rx_bytes: {type: integer, format: int64, minimum: 0}
        tx_bytes: {type: integer, format: int64, minimum: 0}
        rx_bytes_per_second: {type: integer, format: int64, minimum: 0, description: 完整区间的平均 bytes/s，整数向下取整。}
        tx_bytes_per_second: {type: integer, format: int64, minimum: 0}

    CloudNetworkSample:
      type: object
      required: [source, network_type, ip, direction, metric_name, unit, period_seconds, value, sampled_at, checked_at]
      properties:
        source: {type: string, enum: [cms, swas_describe_monitor_data]}
        network_type: {type: string, enum: [classic, vpc, swas]}
        ip: {type: string, nullable: true, format: ipv4}
        direction: {type: string, enum: [ingress, egress]}
        metric_name: {type: string}
        unit: {type: string, enum: [bit/s]}
        period_seconds: {type: integer, enum: [60]}
        value: {type: number, minimum: 0, description: 提供方该分钟的 Average；非计费字节。}
        sampled_at: {type: string, format: date-time}
        checked_at: {type: string, format: date-time, description: 最近一次完整查询观察到该样本的时间。}

    CloudNetwork:
      type: object
      required: [source, network_type, topology_complete, checked_at, streams]
      properties:
        source:
          type: string
          enum: [cms, swas_describe_monitor_data]
        network_type:
          type: string
          enum: [classic, vpc, swas, unknown]
          description: Last verified network type; may be retained when current topology is incomplete.
        topology_complete:
          type: boolean
          description: False means streams may be retained from earlier topology and must not be presented as current coverage.
        checked_at: {type: string, format: date-time}
        streams:
          type: array
          description: VPC uses distinct public IPv4 streams; classic/SWAS use one instance stream with ip=null. Empty does not imply zero traffic. Never sum asynchronous samples or duplicate these with EIP metrics.
          items:
            type: object
            required: [ip, ingress, egress]
            properties:
              ip: {type: string, nullable: true, format: ipv4}
              ingress: {$ref: "#/components/schemas/CloudNetworkRate"}
              egress: {$ref: "#/components/schemas/CloudNetworkRate"}
    CloudNetworkRate:
      type: object
      required: [metric_name, unit, period_seconds, value, status, observed_at, checked_at, last_error]
      properties:
        metric_name:
          type: string
          enum: [InternetInRate, InternetOutRate, VPC_PublicIP_InternetInRate, VPC_PublicIP_InternetOutRate, VPC_PUBLICIP_INTERNETIN_RATE, VPC_PUBLICIP_INTERNETOUT_RATE]
        unit: {type: string, enum: [bit/s]}
        period_seconds: {type: integer, enum: [60]}
        value: {type: number, nullable: true, minimum: 0, description: "Latest provider Average; one-minute bandwidth, not a byte counter or link capacity."}
        status: {type: string, enum: [ok, stale, unknown]}
        observed_at: {type: string, nullable: true, format: date-time}
        checked_at: {type: string, format: date-time}
        last_error:
          type: object
          nullable: true
          properties:
            code: {type: string}
            message: {type: string}

    InstanceCPU:
      type: object
      required: [source, namespace, usage, credit_balance]
      properties:
        source:
          type: string
          enum: [cms, swas_describe_monitor_data]
        namespace:
          type: string
          nullable: true
          enum: [acs_ecs_dashboard, null]
        usage:
          $ref: "#/components/schemas/CPUMetric"
        credit_balance:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/CPUMetric"
          description: ECS absolute credits; null for SWAS, whose CPU endpoint does not expose this metric.

    CPUMetric:
      type: object
      required: [metric_name, unit, period_seconds, value, status, observed_at, checked_at, last_error]
      properties:
        metric_name:
          type: string
          enum: [CPUUtilization, TotalCredit, CPU_UTILIZATION]
        unit:
          type: string
          enum: [percent, count]
        period_seconds:
          type: integer
          enum: [60]
        value:
          type: number
          nullable: true
          minimum: 0
          description: Latest Average sample; CPU utilization is 0–100 percent, credit balance is an absolute count, not a percent.
        status:
          type: string
          enum: [ok, stale, unknown]
        observed_at:
          type: string
          format: date-time
          nullable: true
          description: Provider sample timestamp, preserved across failures.
        checked_at:
          type: string
          format: date-time
          description: Last background query attempt, not the metric timestamp.
        last_error:
          type: object
          nullable: true
          properties:
            code:
              type: string
            message:
              type: string

    Instance:
      type: object
      required:
        - id
        - cloud_instance_id
        - name
        - account_id
        - kind
        - region_id
        - zone_id
        - spec
        - status
        - public_ips
        - charge_type
        - expires_at
        - billing_subject_id
        - billing_subject_kind
        - metering_rule
        - bandwidth_mbps
        - bandwidth_package_name
        - counts_toward_cdt
        - cdt_scope
        - agent
        - realtime_protection
        - realtime
        - updated_at
      properties:
        id:
          type: string
        cloud_instance_id:
          type: string
          description: 阿里云实例 ID。
        name:
          type: string
        account_id:
          type: string
        kind:
          $ref: "#/components/schemas/InstanceKind"
        region_id:
          type: string
        zone_id:
          type: string
          nullable: true
        spec:
          type: string
          description: ECS 为实例规格（如 ecs.e-c4m1.large）；轻量为套餐描述。
        status:
          $ref: "#/components/schemas/InstanceStatus"
        desired_state:
          type: string
          nullable: true
          enum: [running, stopped, quota_stopped, null]
          description: Recorded intent, not observed cloud state. Null before the first recorded intent; quota_stopped is reserved for future protection rules.
        desired_state_updated_at:
          type: string
          format: date-time
          nullable: true
          description: Time the latest distinct intent was enqueued. Replaying an event key does not change this time or overwrite newer intent.
        cloud_network:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/CloudNetwork"
          description: Cloud rate fallback for instances without agent; separate from realtime agent values. Collected in background, aged stale after ten minutes; GET never queries clouds. No history or byte aggregation yet.
        cpu:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/InstanceCPU"
          description: Cached CPU samples from ECS CMS or SWAS DescribeMonitorData. GET performs no cloud calls.
        public_ips:
          type: array
          description: 公网 IPv4。
          items:
            type: object
            required: [address, type]
            properties:
              address:
                type: string
              type:
                $ref: "#/components/schemas/PublicIpType"
        ipv6:
          type: object
          allOf:
            - $ref: "#/components/schemas/InstanceIPv6"
          nullable: true
          description: Assigned ECS IPv6 addresses; allocation does not prove public connectivity, internet bandwidth or CDT eligibility. Null for SWAS; absent in older snapshots.
        charge_type:
          $ref: "#/components/schemas/ChargeType"
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: 包年包月的到期时间；按量为 null。
        billing_subject_id:
          type: string
          nullable: true
          description: Single confirmed public billing exit; null for multiple exits or unresolved topology. Use billing_subject_ids for all discovered exits.
        billing_subject_ids:
          type: array
          description: All discovered public billing exits; singular summary fields are null when more than one exists.
          items:
            type: string
        billing_subject_kind:
          type: string
          allOf:
            - $ref: "#/components/schemas/BillingSubjectKind"
          nullable: true
          description: 没有公网出口时为 null。
        metering_rule:
          type: string
          allOf:
            - $ref: "#/components/schemas/MeteringRule"
          nullable: true
        bandwidth_mbps:
          type: integer
          nullable: true
          description: 实际生效的公网带宽上限（实例、EIP 或所在共享带宽）。
        renewal:
          $ref: "#/components/schemas/InstanceRenewal"
        bandwidth_package_name:
          type: string
          nullable: true
          description: 所在共享带宽的名称；不在共享带宽里为 null。
        network_capacity:
          type: object
          allOf:
            - $ref: "#/components/schemas/InstanceNetworkCapacity"
          nullable: true
          description: ECS specification capacity and public outbound comparison from the latest resource scan. Null for SWAS; absent in snapshots collected before this feature.
        counts_toward_cdt:
          type: boolean
          nullable: true
          description: Null until CDT upgrade, line eligibility and topology are verified; never treat null as false.
        cdt_scope:
          type: string
          allOf:
            - $ref: "#/components/schemas/QuotaScope"
          nullable: true
          description: 计入国内还是海外额度；不计入 CDT 为 null。
        agent:
          $ref: "#/components/schemas/Agent"
        realtime_protection:
          $ref: "#/components/schemas/RealtimeProtection"
        realtime:
          type: object
          allOf:
            - $ref: "#/components/schemas/InstanceRealtime"
          nullable: true
          description: 最近一次 agent 上报算出的公网速率；没有 agent 或掉线为 null。
        updated_at:
          type: string
          format: date-time
          description: 这台实例的资源信息最近一次从阿里云更新的时间。

    InstanceRenewal:
      type: object
      required: [status, source, checked_at, last_error]
      properties:
        status:
          type: string
          enum: [auto_renewal, manual_renewal, no_renewal, unknown, not_applicable]
          description: A configured renewal policy, not proof that a renewal payment will succeed. Known pay-as-you-go/spot instances are not_applicable; unavailable or ambiguous subscription data is unknown.
        source:
          type: string
          nullable: true
          enum: [ecs_describe_instance_auto_renew_attribute, bss_query_available_instances, null]
        checked_at:
          type: string
          format: date-time
        last_error:
          type: object
          nullable: true
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string

    InstanceNetworkCapacity:
      type: object
      required: [source, checked_at, rx_kbps, tx_kbps, public_outbound_mbps, public_outbound_exceeds_spec, last_error]
      properties:
        source:
          type: string
          enum: [ecs_describe_instance_types]
        checked_at:
          type: string
          format: date-time
        rx_kbps:
          type: integer
          format: int64
          nullable: true
          description: InstanceBandwidthRx, kbit/s as documented by ECS. Not a measured rate or a public inbound allowance.
        tx_kbps:
          type: integer
          format: int64
          nullable: true
          description: InstanceBandwidthTx, kbit/s as documented by ECS. Not a throughput guarantee.
        public_outbound_mbps:
          type: integer
          format: int64
          nullable: true
          description: Known single public exit ceiling, using shared-package bandwidth for member EIPs. Shared bandwidth is not reserved for this instance.
        public_outbound_exceeds_spec:
          type: boolean
          nullable: true
          description: Whether public_outbound_mbps * 1000 exceeds tx_kbps. Null if either source is unavailable or topology is ambiguous. False only means this outbound comparison did not find a mismatch; it does not certify overall network health.
        last_error:
          type: object
          nullable: true
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string

    FinanceSource:
      type: object
      required: [status, fetched_at, last_attempt_at, last_error, data]
      properties:
        status:
          type: string
          enum: [never_synced, ok, failing]
          description: Result of the latest attempt, not a guarantee that cached data is recent. Check timestamps and account enabled state.
        fetched_at:
          type: string
          format: date-time
          nullable: true
          description: Last successful retrieval; not a provider accounting cutoff.
        last_attempt_at:
          type: string
          format: date-time
          nullable: true
        last_error:
          type: object
          nullable: true
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
        data:
          type: object
          nullable: true
          description: Last successful payload; remains present with its original fetched_at on later failure.

    InstanceFinance:
      type: object
      required: [instance_id, account_id, enabled, billing_cycle, updated_at, bill]
      properties:
        instance_id:
          type: string
        account_id:
          type: string
        enabled:
          type: boolean
          description: Whether the owning account is enabled for collection.
        billing_cycle:
          type: string
          pattern: '^\d{4}-\d{2}$'
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: Latest attempt; not a provider billing cutoff.
        bill:
          allOf:
            - $ref: "#/components/schemas/FinanceSource"
            - type: object
              properties:
                data:
                  type: object
                  nullable: true
                  required: [billing_cycle, items]
                  properties:
                    billing_cycle:
                      type: string
                    items:
                      type: array
                      description: Original provider rows matched to this instance, with at most 15000 account rows scanned. Subscription orders reflect this month's bills, not amortized monthly cost. Payment and outstanding amounts are unavailable from this source.
                      items:
                        $ref: "#/components/schemas/InstanceBillItem"

    InstanceBillItem:
      type: object
      required: [cloud_instance_id, bill_type, product_code, pip_code, product_name, currency, pretax_amount, after_discount_amount]
      properties:
        cloud_instance_id:
          type: string
        bill_type:
          type: string
          description: Unmodified provider Item, e.g. SubscriptionOrder, PayAsYouGoBill, Refund, Adjustment. Do not infer refund/adjustment signs or sum unlike currencies.
        product_code:
          type: string
        pip_code:
          type: string
          description: Provider normalized product code; SWAS can have ProductCode=ace_eweb and PipCode=swas.
        product_name:
          type: string
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        pretax_amount:
          type: string
          description: Exact provider payable amount, not paid cash.
        after_discount_amount:
          type: string
          description: Exact amount after discount, before coupon deductions; not an additional charge to add to pretax_amount.

    AccountFinance:
      type: object
      required: [account_id, enabled, billing_cycle, updated_at, balance, bill]
      properties:
        account_id:
          type: string
        enabled:
          type: boolean
        billing_cycle:
          type: string
          pattern: '^\d{4}-\d{2}$'
          description: Current YYYY-MM in the configured business timezone, sent explicitly to QueryBillOverview. Previous-month snapshots are not substituted.
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: Most recent attempt across these two sources.
        balance:
          allOf:
            - $ref: "#/components/schemas/FinanceSource"
