  /instances/{instance_id}/cloud-network-history:
    parameters:
      - name: instance_id
        in: path
        required: true
        schema: {type: string}
    get:
      tags: [instances]
      operationId: getCloudNetworkHistory
      summary: 云监控公网速率原始历史
      description: >-
        仅查询本地已采集样本，支持 24h/7d 范围；不现场回查云接口。
        from 包含、to 不包含，范围最多 7 天且 to 不得晚于当前时间。
        结果按 sampled_at 降序、同一时间按内部序号降序；cursor 必须与相同范围和过滤条件一起使用。
        页面间新到达的旧时间样本可能出现在后续页，提供方修订可更新已有样本；不是冻结快照。
        每个 IP/方向独立，不补零、不插值、不跨 IP 求和，不将速率积分为计费字节。
        启用前、停采、失败或超过查询窗口的离线时段可能缺失；空结果不代表零流量。
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: true, schema: {type: string, format: date-time}}
        - name: direction
          in: query
          schema: {type: string, enum: [ingress, egress]}
        - name: ip
          in: query
          description: 可选公网 IPv4，仅筛选有 IP 维度的 VPC 序列。
          schema: {type: string, format: ipv4}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000, default: 500}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        "200":
          description: 原始样本；当前账号停用或实例消失不删除历史。
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor, from, to]
                properties:
                  from: {type: string, format: date-time}
                  to: {type: string, format: date-time}
                  next_cursor: {type: string, nullable: true}
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/CloudNetworkSample"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}

  /instances/{instance_id}/agent-network-history:
    parameters:
      - {name: instance_id, in: path, required: true, schema: {type: string}}
    get:
      tags: [instances]
      operationId: getAgentNetworkHistory
      summary: Agent 原始采样与区间流量历史
      description: >-
        本地只读，按 sampled_at、counter_epoch、sequence 降序分页；from 包含，to 不包含。
        范围最多七天，to 不晚于当前时间。历史保留撤销前和重注册前的数据，不代表 agent 当前在线。
        每条保留累计计数与接收时质量；可比较的同代际相邻已存样本提供完整区间差值与平均 bytes/s。
        缺序列或长间隔标 gap，不能用连线或插值伪造瞬时变化；补报 stale 不等于区间差值无效。
        首个样本的前序可能早于 from，返回的是整个跨界区间，不能直接相加当作查询范围或小时总量。
        重启、新基线、规则变化、时钟倒退、缺少元数据、非法计数或速率溢出时 interval=null，附原因。
        不将 agent 与云监控相加，不产生 CDT 实时估算或保护判断。
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 500}}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        "200":
          description: 原始样本；未安装 agent 或窗口无数据时为空数组。
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor, from, to]
                properties:
                  from: {type: string, format: date-time}
                  to: {type: string, format: date-time}
                  next_cursor: {type: string, nullable: true}
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/AgentNetworkSample"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}

  /settings/heartbeat:
    get:
      tags: [settings]
      operationId: getHeartbeatSettings
      summary: 外部心跳配置和最近结果
      description: URL 可能自带密钥，永不回读；不调用外部服务。
      responses:
        "200":
          description: 初始为 disabled、未配置地址、60 秒周期。
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HeartbeatSettings"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    put:
      tags: [settings]
      operationId: putHeartbeatSettings
      summary: 保存外部心跳
      description: >-
        配置保存在本地，不同步发送。URL 完整 AES-GCM 加密；省略 url 保留，空字符串清除（仅 disabled 时允许）。
        使用 HTTPS GET，不携带日志或其他凭据，不跟随重定向、不读取环境代理。默认 60 秒，范围 15–86400 秒。
        revision 必须匹配；修改清除旧结果、取消未完成测试并隔离旧 worker 回写。
        已开始的网络请求不能撤回。只在生产 serve 启用；run-once 和开发模式不发心跳。
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision, enabled, interval_seconds]
              properties:
                revision: {type: integer, format: int64, minimum: 0}
                enabled: {type: boolean}
                interval_seconds: {type: integer, minimum: 15, maximum: 86400}
                url: {type: string, writeOnly: true, maxLength: 2048}
      responses:
        "200":
          description: 已加密保存；尚不代表外部送达。
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HeartbeatSettings"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "503":
          description: 主密钥或生产写入能力不可用。
  /settings/heartbeat/test:
    post:
      tags: [settings]
      operationId: testHeartbeat
      summary: 排队测试已配置的心跳地址
      description: >-
        接受空 JSON 对象；允许测试已配置但 disabled 的目标。需要通过与定时心跳相同的健康条件，
        不绕过健康检查发送假成功。相同配置的活动测试去重；结果经通用 jobs 查询。进程中断后的运行中测试失败，不重放。
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EmptyObject"}
      responses:
        "202":
          description: 已入队。
          content:
            application/json:
              schema:
                type: object
                required: [job_id]
                properties:
                  job_id: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "503":
          description: 生产发送能力不可用。

  /notify/quiet-hours:
    get:
      tags: [notify]
      operationId: getQuietHours
      summary: 每日静默与临时维护期
      responses:
        "200":
          description: 业务时区来自全局设置；active 按查询时刻计算。
          content:
            application/json:
              schema: {$ref: "#/components/schemas/QuietHours"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    put:
      tags: [notify]
      operationId: putQuietHours
      summary: 保存静默策略
      description: >-
        enabled 只控制每日时段，maintenance 非空时独立生效。
        每日 start 包含、end 不包含，允许跨午夜，二者不得相同；每日按业务时区的墙钟时间判断。
        maintenance 为 UTC/RFC3339 起止时刻（含起点不含终点），null 表示清除。
        用户确认非紧急告警仅记录，不在静默结束后补发。紧急告警、额度类、保护执行、agent 掉线及显式测试不静默。
        保存时处理当前到期且尚未领取的非紧急通知，发送前也会重查；已经授权或开始的网络请求无法撤回。
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision, enabled, start, end, maintenance]
              properties:
                revision: {type: integer, format: int64, minimum: 0}
                enabled: {type: boolean}
                start: {type: string, pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'}
                end: {type: string, pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'}
                maintenance:
                  type: object
                  nullable: true
                  allOf:
                    - $ref: "#/components/schemas/MaintenanceWindow"
      responses:
        "200":
          description: 已保存；旧的静默记录不会重新入队。
          content:
            application/json:
              schema: {$ref: "#/components/schemas/QuietHours"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}

