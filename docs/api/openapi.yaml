        chat_id:
          type: string
        proxy_mode:
          $ref: "#/components/schemas/TelegramProxyMode"
        proxy_url:
          type: string

    AlertRuleKey:
      type: string
      enum: [cdt_usage, cdt_forecast_exceed, account_api_failure, agent_offline, cdt_official_unavailable, instance_expiring, spec_bandwidth_insufficient, instance_public_ip_changed, balance_low, network_latency, network_loss, network_unreachable, network_route_change]
      description: 内置规则；仅返回当前已实现且有可用来源的规则。

    Severity:
      type: string
      enum: [info, warning, serious, critical]

    AlertRuleParams:
      type: object
      description: 每条规则只用到其中一部分字段，用不到的字段不返回。spec_bandwidth_insufficient、instance_public_ip_changed 和 network_route_change 使用空对象，无额外阈值。公网 IP 和线路变化按每次有效事件记录，不产生恢复通知；线路还需要组合中明确开启 notify_changes。
      properties:
        probe_thresholds:
          type: array
          maxItems: 100
          description: Latency/loss/unreachable rules only. network_latency evaluates only listed plans with an explicit latency_ms; no latency limit is guessed. network_loss and network_unreachable apply to all enabled plans by default; entries override or disable individual plans. Empty list uses those defaults. Retired plan entries remain dormant. Threshold edits restart evidence windows without reinterpreting old runs. Disabling monitoring or replacing a point/target/protocol closes the old condition silently; it is not a recovery.
          items:
            type: object
            required: [plan_id]
            additionalProperties: false
            properties:
              plan_id: {type: string, minLength: 1, maxLength: 128}
              enabled: {type: boolean, default: true}
              latency_ms: {type: number, exclusiveMinimum: true, minimum: 0, maximum: 60000, description: network_latency only; required for enabled listed plans. Compare average RTT with strict greater-than.}
              loss_percent: {type: number, minimum: 0, maximum: 100, default: 5, description: network_loss only; omitted value means 5 percent. TCP counts failed connection attempts.}
        duration_seconds:
          type: integer
          minimum: 60
          maximum: 86400
          default: 600
          description: network_latency only. Successive valid above-threshold measurements must span this duration, with at least two results; elapsed wall time alone cannot fire an alert.
        recovery_samples:
          type: integer
          minimum: 1
          maximum: 1000
          default: 3
          description: Latency/loss/unreachable rules only. Consecutive valid healthy measurements required for recovery. Skipped/missing/local-failure samples interrupt counters and never imply recovery.
        balance_thresholds:
          type: array
          maxItems: 100
          description: balance_low only, required for this rule. Empty means no accounts configured. One entry per existing account; disabled accounts retain configuration but are not evaluated. Uses available_amount, not cash-only balance. Changes are evaluated on the next successful fetch.
          items:
            type: object
            required: [account_id, currency, amount]
            additionalProperties: false
            properties:
              account_id:
                type: string
                minLength: 1
                maxLength: 128
              currency:
                type: string
                pattern: '^[A-Z]{3}$'
              amount:
                type: string
                maxLength: 80
                pattern: '^-?(0|[1-9][0-9]*)(\.[0-9]{1,12})?$'
                description: Exact signed decimal threshold, at most 12 fractional digits and 256 bits after scaling by 10^12; no exponent or thousands separators. Zero is valid; no default amount is inferred.
        before_days:
          type: integer
          minimum: 0
          maximum: 365
          description: instance_expiring only. Default 7; compare freshly collected expiry against now plus this many 24-hour days. Missing expiry is unknown. Stopped subscription instances remain applicable.
        thresholds_percent:
          type: array
          description: cdt_usage 的默认档位（账号可以单独覆盖）。
          items:
            type: integer
        consecutive_failures:
          type: integer
          minimum: 1
          maximum: 1000
          description: account_api_failure、cdt_official_unavailable 为连续失败次数；network_unreachable 为完整测速全部失败的连续次数，默认 3。
        offline_after_seconds:
          type: integer
          minimum: 10
          maximum: 86400
          description: agent_offline：连续多少秒无新鲜上报视为掉线，默认 30。实例状态和 settings 使用同一值；关闭告警不关闭状态监测。尚未收到首次有效上报的注册不触发掉线告警。

    AlertRule:
      type: object
      required: [key, enabled, params, urgent]
      properties:
        key:
          $ref: "#/components/schemas/AlertRuleKey"
        enabled:
          type: boolean
        params:
          $ref: "#/components/schemas/AlertRuleParams"
        urgent:
          type: boolean
          description: 紧急告警不受每日静默或临时维护期影响。

    AlertRuleUpdate:
      type: object
      properties:
        enabled:
          type: boolean
        params:
          $ref: "#/components/schemas/AlertRuleParams"

    NotificationKind:
      type: string
      enum: [alert, recovery, test]

    DeliveryStatus:
      type: string
      enum: [pending, sent, failed, not_sent]
      description: not_sent = 只记录不发送（未配置渠道、静默或规则取消等）；不会自动补发，结合 suppression_reason 与 last_error 判断。

    Notification:
      type: object
      required: [id, created_at, kind, severity, rule_key, title, body, account_id, instance_id, probe_plan_id, delivery_status]
      properties:
        id:
          type: string
        created_at:
          type: string
          format: date-time
        kind:
          $ref: "#/components/schemas/NotificationKind"
        severity:
          $ref: "#/components/schemas/Severity"
        rule_key:
          type: string
          allOf:
            - $ref: "#/components/schemas/AlertRuleKey"
          nullable: true
        title:
          type: string
          description: 已渲染好的中文标题（与发到 Telegram 的一致）。
        body:
          type: string
        account_id:
          type: string
          nullable: true
        instance_id:
          type: string
          nullable: true
        probe_plan_id:
          type: string
          nullable: true
          description: Network alert combination identity; null for other notifications.
        delivery_status:
          $ref: "#/components/schemas/DeliveryStatus"
        urgent: {type: boolean, description: 服务端判定并持久保存，前端不能编辑单条通知的紧急性。}
        suppression_reason: {type: string, nullable: true, enum: [daily, maintenance, null]}
        suppressed_at: {type: string, format: date-time, nullable: true}
        attempts:
          type: integer
          minimum: 0
        last_error:
          type: object
          nullable: true
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
        delivered_at:
          type: string
          format: date-time
          nullable: true
        has_uncertain_attempt:
          type: boolean
          description: At least one attempt may have reached Telegram without a confirmed response. A failed record is not proof of non-delivery; if a later attempt succeeds, duplicates may be possible.

    InstanceRealtimeEvent:
      type: object
      description: 事件流 `instance.realtime` 的 data。
      required: [instance_id, realtime]
      properties:
        instance_id:
          type: string
        realtime:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/InstanceRealtime"
          description: Null clears the prior rate on offline, revocation, counter reset or insufficient samples.

    AgentStatusEvent:
      type: object
      description: 事件流 `agent.status` 的 data。
      required: [instance_id, agent, realtime_protection]
      properties:
        instance_id:
          type: string
        agent:
          $ref: "#/components/schemas/Agent"
        realtime_protection:
          $ref: "#/components/schemas/RealtimeProtection"
