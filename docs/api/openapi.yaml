  /system-events:
    get:
      tags: [instances]
      operationId: listSystemEvents
      summary: 云端系统事件与来源状态
      description: |
        Read persisted ECS history and CMS spot signals, newest first-seen record first. Updates do not move the cursor order.
        A provider's Executed status is not proof of instance reclamation. Missing from a successful query is not resolution.
        Events from the two sources remain separate. Sources is empty before any scan is recorded, not proof that no events exist.
        Disabled accounts retain history. No GET-triggered cloud queries, notifications or resource actions.
      parameters:
        - name: account_id
          in: query
          schema:
            type: string
        - name: instance_id
          in: query
          schema:
            type: string
        - name: region_id
          in: query
          schema:
            type: string
        - name: source
          in: query
          schema:
            type: string
            enum: [ecs_history, cms_spot]
        - name: category
          in: query
          schema:
            type: string
            enum: [maintenance, spot_interruption, other]
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Cached events and health of sources matching account/region/source/instance filters.
          content:
            application/json:
              schema:
                type: object
                required: [items, sources, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SystemEvent"
                  sources:
                    type: array
                    items:
                      $ref: "#/components/schemas/SystemEventSource"
                  next_cursor:
                    type: string
                    nullable: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"

