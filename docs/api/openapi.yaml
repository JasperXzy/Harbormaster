        "503":
          description: Passkey 不可用或数据库暂不可用。
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}

  /instances/{instance_id}/cloud-network-history:
    parameters:
      - name: instance_id
        in: path
        required: true
        schema: {type: string}
    get:
      tags: [instances]
      operationId: getCloudNetworkHistory
      summary: 云监控公网速率原始历史
      description: >-
        仅查询本地已采集样本，支持 24h/7d 范围；不现场回查云接口。
        from 包含、to 不包含，范围最多 7 天且 to 不得晚于当前时间。
        结果按 sampled_at 降序、同一时间按内部序号降序；cursor 必须与相同范围和过滤条件一起使用。
        页面间新到达的旧时间样本可能出现在后续页，提供方修订可更新已有样本；不是冻结快照。
        每个 IP/方向独立，不补零、不插值、不跨 IP 求和，不将速率积分为计费字节。
        启用前、停采、失败或超过查询窗口的离线时段可能缺失；空结果不代表零流量。
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: true, schema: {type: string, format: date-time}}
        - name: direction
          in: query
          schema: {type: string, enum: [ingress, egress]}
        - name: ip
          in: query
          description: 可选公网 IPv4，仅筛选有 IP 维度的 VPC 序列。
          schema: {type: string, format: ipv4}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000, default: 500}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        "200":
          description: 原始样本；当前账号停用或实例消失不删除历史。
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor, from, to]
                properties:
                  from: {type: string, format: date-time}
                  to: {type: string, format: date-time}
                  next_cursor: {type: string, nullable: true}
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/CloudNetworkSample"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}

  /instances/{instance_id}/agent-hourly-history:
    get:
      tags: [instances]
      operationId: listInstanceAgentHourlyHistory
      summary: 实例采集程序的小时聚合流量历史（最长 13 个月）
      description: |
        Time-prorated UTC hourly buckets derived from cumulative agent samples. Boundary-crossing intervals are prorated and marked estimated=true.
        Display and trend analysis only; never used for CDT cutoff alignment or automatic shutdown.
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: 小时聚合流量序列
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHourlyHistoryPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /instances/{instance_id}/agent-network-history:
    parameters:
      - {name: instance_id, in: path, required: true, schema: {type: string}}
    get:
      tags: [instances]
      operationId: getAgentNetworkHistory
      summary: Agent 原始采样与区间流量历史
      description: >-
        本地只读，按 sampled_at、counter_epoch、sequence 降序分页；from 包含，to 不包含。
        范围最多七天，to 不晚于当前时间。历史保留撤销前和重注册前的数据，不代表 agent 当前在线。
        每条保留累计计数与接收时质量；可比较的同代际相邻已存样本提供完整区间差值与平均 bytes/s。
        缺序列或长间隔标 gap，不能用连线或插值伪造瞬时变化；补报 stale 不等于区间差值无效。
        首个样本的前序可能早于 from，返回的是整个跨界区间，不能直接相加当作查询范围或小时总量。
        重启、新基线、规则变化、时钟倒退、缺少元数据、非法计数或速率溢出时 interval=null，附原因。
        不将 agent 与云监控相加，不产生 CDT 实时估算或保护判断。
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 500}}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        "200":
          description: 原始样本；未安装 agent 或窗口无数据时为空数组。
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor, from, to]
                properties:
                  from: {type: string, format: date-time}
                  to: {type: string, format: date-time}
                  next_cursor: {type: string, nullable: true}
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/AgentNetworkSample"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}

  /settings/branding:
    get:
      tags: [system]
      operationId: getBranding
      summary: Read the configured panel name and Logo metadata
      description: Local read only; session and the panel access restrictions apply. The default is Harbormaster with logo=null. No cloud requests or external image downloads.
      responses:
        "200":
          description: Current configuration
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Branding"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    put:
      tags: [system]
      operationId: putBrandingName
      summary: Update the panel name
      description: Trims surrounding whitespace. Preserves the current Logo. Send the latest revision; stale edits return branding_changed. Saving the same normalized name is a no-op. Use Harbormaster to restore the default name. Demo writes return 501.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision, name]
              properties:
                revision: {type: integer, format: int64, minimum: 0}
                name: {type: string, minLength: 1, maxLength: 100, description: Plain Unicode text without control characters.}
      responses:
        "200":
          description: Current configuration after the update
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Branding"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "501": {description: Development fixtures do not persist configuration writes.}

  /settings/branding/logo:
    get:
      tags: [system]
      operationId: getBrandingLogo
      summary: Read the current custom Logo
      description: Session-protected current normalized PNG, or 404 when no custom Logo exists. The returned metadata URL contains the current revision to refresh the image after a change; this endpoint does not retain historical image versions. Responses use no-store.
      parameters:
        - name: revision
          in: query
          schema: {type: integer, format: int64, minimum: 0}
          description: Optional image refresh hint; the current image is returned.
      responses:
        "200":
          description: Normalized custom image
          content:
            image/png:
              schema: {type: string, format: binary}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      tags: [system]
      operationId: putBrandingLogo
      summary: Upload a custom Logo
      description: Send raw PNG or JPEG bytes with its matching Content-Type and the latest shared revision query value. Maximum input 2 MiB, width and height each 1–512 pixels. Decodes locally, strips source metadata/trailing data, converts to 8-bit and stores static PNG. No external URL fetch. Invalid content/dimensions return validation_failed with fields.logo; oversized bodies return branding_logo_too_large. Identical normalized images are a no-op. Demo writes return 501.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: revision
          in: query
          required: true
          schema: {type: integer, format: int64, minimum: 0}
      requestBody:
        required: true
        content:
          image/png:
            schema: {type: string, format: binary, maxLength: 2097152}
          image/jpeg:
            schema: {type: string, format: binary, maxLength: 2097152}
      responses:
        "200":
          description: Current configuration including normalized image dimensions and size
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Branding"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {description: branding_logo_too_large; the configuration is unchanged.}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "501": {description: Development fixtures do not persist configuration writes.}
    delete:
      tags: [system]
      operationId: deleteBrandingLogo
      summary: Remove the custom Logo
      description: Preserves the configured name. Requires the latest shared revision; already absent is a no-op. Demo writes return 501.
