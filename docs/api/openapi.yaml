    SWASTrafficPackage:
      type: object
      required: [source, status, entry_present, usage, fetched_at, last_attempt_at, updated_at, last_error, direction, reset_day, official_as_of, next_reset_at]
      properties:
        source: {type: string, enum: [swas_list_instances_traffic_packages]}
        status:
          type: string
          enum: [never_fetched, ok, unavailable, stale, disabled]
          description: ok requires a successful fetch at most ten minutes old. A failed latest attempt is unavailable and can retain older values with their original fetched_at. Account disable or region removal is disabled. No data from a different credential version or known plan ID is reused.
        entry_present:
          type: boolean
          nullable: true
          description: Whether the last successful response included a usage row for this instance. Null before success; false preserves an empty result without manufacturing usage. Package classification remains in billing_subject_kind.
        usage:
          type: object
          nullable: true
          required: [total_bytes, used_bytes, remaining_bytes, overflow_bytes]
          description: Literal provider fields from the current month at query time. No recomputation or addition of overflow to another field; no percentage or forecast is inferred.
          properties:
            total_bytes: {type: integer, format: int64, minimum: 0, maximum: 9007199254740991}
            used_bytes: {type: integer, format: int64, minimum: 0, maximum: 9007199254740991}
            remaining_bytes: {type: integer, format: int64, minimum: -9007199254740991, maximum: 9007199254740991, description: Preserve the signed provider value; its behavior after overage has not been verified on a real fixed-quota plan.}
            overflow_bytes: {type: integer, format: int64, minimum: 0, maximum: 9007199254740991}
        fetched_at: {type: string, format: date-time, nullable: true, description: Last successful retrieval time.}
        last_attempt_at: {type: string, format: date-time, nullable: true}
        updated_at: {type: string, format: date-time, nullable: true, description: Most recent source attempt time.}
        last_error:
          type: object
          nullable: true
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
        direction: {type: string, enum: [outbound]}
        reset_day: {type: integer, enum: [1], description: Documented first day of each calendar month; exact reset timezone is unverified.}
        official_as_of: {type: string, format: date-time, nullable: true, description: Currently null; retrieval time is not a provider cutoff.}
        next_reset_at: {type: string, format: date-time, nullable: true, description: Currently null; no reset timestamp is provided and the billing timezone has not been verified.}

