#     X-CSRF-Token 请求头。是否可行？如果你更想用"双重提交 Cookie"，请直接改这里。
# B3  会话 Cookie 名称草稿写的是 hm_session（HttpOnly、SameSite=Lax）。名称与有效期由你定。
# B4  只有一个管理员、没有用户名（PRD 只写了"管理员密码"）。登录只提交密码，是否与你的设计一致？
# B5  错误体在 WORK_SPLIT 约定的 {code, message} 之外，草稿加了两个可选字段：
#     fields（表单字段 -> 错误码，用于把错误标在具体输入框上）与 retry_after_seconds（登录限速）。能否提供？
# B6  SSE：一条事件流 GET /api/v1/events，事件名见该接口说明。需要确认：
#     (a) 是否支持 Last-Event-ID 续传，还是断线重连后由前端整页重新拉取（草稿按后者）；
#     (b) 心跳间隔（草稿 15 秒一条 ping）；
#     (c) quota.updated 是每个 agent 上报周期（10 秒）都推一次，还是数值变化才推。
# B7  总览页的四个数字、额度池、"需要留意"列表，草稿不设单独的汇总接口，前端用 /accounts、/instances、
#     /traffic/quotas 的结果自己合计。实例很多时是否需要一个 /overview 汇总接口，由你判断。
# B8  Instance.realtime_protection 由后端计算（见枚举说明）。"是否受实时保护"的判定是否能在后端统一给出？
# B9  每日用量 /traffic/daily 的"一天"按哪个时区切分？草稿假设按业务时区（默认 Asia/Shanghai），
#     并由后端在 date 字段里直接给出 YYYY-MM-DD。CDT 官方每日数据的切分方式见 M0 的 V3。
# B10 "今天"这一天的数值 = 官方已出账部分 + 实时增量，草稿用 provisional=true 标记。能否提供？
# B11 共享带宽每小时入 / 出（/bandwidth-packages/{id}/hourly）依赖"按小时聚合"的计费周期假设（M0 的 V4）。
#     如果周期不是 1 小时，period_seconds 字段会告诉前端实际长度。
# B12 计费对象的"官方 / 实时 / 差值"：CDT 官方只有账号合计（PRD 6.3），所以草稿把这三项放在账号级的
#     QuotaStatus 里，计费对象只给今日入 / 出 / 计量值。这一点也已提给用户（PRD F17 流量页的描述需要澄清）。
# B13 通知的 title / body：草稿约定由后端按前端提供的文案模板渲染成中文后返回（因为同一段文字还要发到
#     Telegram）。模板放在 docs/design/ 下，M1 开始时提供。是否接受这种方式？
# B14 告警规则 /alert-rules：后端只返回当前里程碑已经可用的规则；params 是一个固定结构的对象（见 AlertRuleParams），
#     每条规则只用到其中一部分字段。M1 需要的 key：cdt_usage、cdt_forecast_exceed、account_api_failure、
#     agent_offline、cdt_official_unavailable。
# B15 安装命令 POST /instances/{id}/agent/install-command：每次调用是否会让上一次的注册码失效？
#     注册码有效期多长（草稿 expires_at 由后端给出，前端显示倒计时）？
# B16 撤销 agent token 后，实例上的 agent 状态变为 not_installed 还是 offline？草稿按 not_installed
#     （需要重新安装），并且不触发掉线告警。
# B17 权限测试、Telegram 测试消息都按 202 + job_id 处理，结果放在 Job.result 里（结构见 Job 说明）。
#     如果你认为测试消息同步返回更合适，请改。
# B18 删除账号时，其下的实例、agent、历史数据怎么处理？前端的确认文案需要如实告诉用户后果。
# B19 "数据过期"的判定：草稿由前端按 updated_at 与固定时长比较（实时 60 秒、CDT 官方 2 小时、资源扫描 30 分钟）。
#     如果后端更清楚各自的采集周期，可以改为在 /settings 里返回这些时长（草稿已放了 collection 只读字段）。
# B20 分页：实例、通知用游标分页；账号、计费对象、共享带宽、告警规则数量很少，草稿不分页。
# B21 OpenAPI 版本用 3.0.3（Go 侧的代码生成工具普遍支持）。如果你用的工具要求 3.1，请告知。

openapi: 3.0.3
info:
  title: Harbormaster 面板接口
  version: 0.1.0-draft
  description: |
    面板与 hm-server 之间的唯一接口契约。通用约定（见 docs/WORK_SPLIT.md 第 3 节）：

    - 前缀 `/api/v1`，JSON，UTF-8。
    - 时间一律 UTC、RFC 3339；时区换算与显示由前端做。
    - 流量一律整数字节（int64）；速率为"字节每秒"。
    - 枚举为英文 snake_case；中文显示由前端做。
    - 错误体 `{"error": {"code": "...", "message": "..."}}`，`code` 稳定可枚举。
    - 认证：Cookie 会话 + `X-CSRF-Token` 请求头；未登录 401，无权限 403。
    - 耗时操作返回 `202` 与 `job_id`，用 `GET /jobs/{job_id}` 或事件流查询结果。
    - 来自阿里云或 agent 的数据都带 `updated_at`。
    - M0 development mode serves synthetic read data and local sessions only; unsupported operations return 501 with error.code=not_implemented. No cloud or Telegram calls occur.
    - Session cookies use HttpOnly and SameSite=Lax; production HTTPS also uses Secure. GET does not require CSRF; authenticated mutations do.
    - Production browser API requires HTTPS and the configured public host. All mutations, including setup/login/logout, require an Origin matching HM_PUBLIC_URL. Forwarded headers are accepted only from configured trusted proxies; optional admin CIDRs apply only to panel APIs.
    - Production sessions have a configurable absolute lifetime (default 12 hours), without sliding renewal. Logout and CLI password reset revoke sessions server-side. Login/setup allow five attempts per source IP per five minutes, with a shared thirty-attempt ceiling; 429 includes Retry-After and retry_after_seconds.
    - SSE uses a 15-second ping, no replay guarantee, and a fresh snapshot after reconnect. Updates may be coalesced per 10-second report interval.
    - Account quota values are locally configured protection budgets, defaulting to 20/200 x 1024^3 bytes; they do not establish CDT eligibility or a verified official cutoff. Account disable retains snapshots/history and stops new cloud requests; an already-sent request may finish but its stale result cannot replace the disabled account's snapshots.
    - Refresh/permission jobs are persisted with leases and recover after restart. Repeated requests for the same active job scope/type may return the existing job ID. GET endpoints only read database snapshots and never query the cloud.

servers:
  - url: /api/v1

tags:
  - name: setup
    description: 首次安装向导
  - name: session
    description: 登录与会话
  - name: system
    description: 版本、设置、任务、事件流
  - name: accounts
    description: 阿里云账号
  - name: instances
    description: 实例与采集程序（hm-agent）
  - name: traffic
    description: 流量与额度
  - name: notify
    description: 通知渠道、告警规则、通知记录

  - name: network
    description: 测速点、目标、组合与历史

security:
  - sessionCookie: []

paths:
  /traffic/reconciliations:
    get:
      tags: [traffic]
      operationId: listCDTReconciliations
      summary: 读取同截止时刻的估算对账
      parameters:
        - {name: account_id, in: query, schema: {type: string}}
        - {name: scope, in: query, schema: {type: string, enum: [mainland, overseas]}}
        - {name: before, in: query, schema: {type: integer, format: int64, minimum: 1}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: 倒序本地历史，未知／不可比较不会变成 0% 偏差。
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/CDTReconciliation"}}
                  next_before: {type: integer, format: int64, nullable: true}
  /automation/schedules:
    get:
      tags: [instances]
      operationId: listPowerSchedules
      summary: 每日定时开关机规则列表
      responses:
        "200":
          description: 定时规则列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PowerSchedule"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [instances]
      operationId: createPowerSchedule
      summary: 创建每日定时开关机规则（从下个计划时间点起生效）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PowerScheduleInput"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PowerSchedule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /automation/schedules/{schedule_id}:
    parameters:
      - name: schedule_id
        in: path
        required: true
        schema:
          type: string
    put:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [instances]
      operationId: updatePowerSchedule
      summary: 修改每日定时开关机规则
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PowerScheduleInput"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PowerSchedule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [instances]
      operationId: deletePowerSchedule
      summary: 删除每日定时开关机规则
      parameters:
        - name: revision
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: 已删除
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /automation/keepalive:
    get:
      tags: [instances]
      operationId: getKeepaliveSettings
      summary: 实例意外停止保活配置
      responses:
        "200":
          description: 保活配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeepaliveSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [instances]
      operationId: updateKeepaliveSettings
      summary: 修改实例意外停止保活配置
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeepaliveSettings"
      responses:
        "200":
          description: 已保存
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeepaliveSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /automation/monthly-reset:
    get:
      tags: [instances]
      operationId: getMonthlyResetSettings
      summary: 每月 1 号额度停机自动开机配置
      responses:
        "200":
          description: 月初自动开机配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyResetSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [instances]
      operationId: updateMonthlyResetSettings
      summary: 修改每月 1 号额度停机自动开机配置
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonthlyResetSettings"
      responses:
        "200":
          description: 已保存
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyResetSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /automation/failovers:
    get:
      tags: [instances]
      operationId: listFailoverRules
      summary: 主备切换规则列表
      responses:
        "200":
          description: 主备切换规则列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/FailoverRule"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [instances]
      operationId: createFailoverRule
      summary: 新建主备切换规则
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FailoverRuleInput"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailoverRule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /automation/failovers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [instances]
      operationId: updateFailoverRule
      summary: 修改主备切换规则
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FailoverRuleInput"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailoverRule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [instances]
      operationId: deleteFailoverRule
      summary: 删除主备切换规则
      parameters:
        - name: revision
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "204":
          description: 已删除
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /instances/{instance_id}/change-eip:
    parameters:
      - $ref: "#/components/parameters/InstanceId"
    post:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [instances]
      operationId: rotateInstanceEIP
      summary: 申请新弹性公网 IP 并替换当前受管 EIP
      description: |
        需生产开启 HM_EIP_MANAGE_ENABLED=true。严格保护：若实例当前绑定了非本面板创建的原有 EIP 或固定公网 IP，自动返回 409 unmanaged_eip_protected / eip_rotate_unsupported，绝不解绑或释放原有 EIP。
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{16,64}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EIPRotateInput"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          description: eip_manage_disabled or internal_error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cloud/ecs-catalog:
    get:
      tags: [instances]
      operationId: getECSCatalog
      summary: 查询指定账号与地域的可用区、镜像、规格与 VPC/交换机选项
      parameters:
        - name: account_id
          in: query
          required: true
          schema:
            type: string
        - name: region_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ECS 创建目录数据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ECSCatalog"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "502":
          description: 阿里云接口查询失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /instances/create:
    post:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [instances]
      operationId: createECSInstance
      summary: 创建按量或抢占式 ECS 实例
      description: 需生产开启 HM_INSTANCE_CREATE_ENABLED=true。不支持包年包月。
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{16,64}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ECSCreateInput"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          description: instance_create_disabled or internal_error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /instances/{instance_id}/intent-confirmation:
    parameters:
      - $ref: "#/components/parameters/InstanceId"
    post:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [instances]
      operationId: confirmInstanceIntent
      summary: 确认面板之外被关机实例的期望状态（保持停止 / 恢复运行）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [keep_stopped, restore_running]
      responses:
        "200":
          description: 已确认期望状态
          content:
            application/json:
              schema:
                type: object
                required: [instance_id, desired_state, job_id]
                properties:
                  instance_id:
                    type: string
                  desired_state:
                    type: string
                    enum: [running, stopped, quota_stopped]
                  job_id:
                    type: string
                    nullable: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /protection/status:
    get:
      tags: [traffic]
      operationId: getProtectionStatus
      summary: 读取保护执行开关与服务自身绑定
      responses:
        "200":
          description: 身份未知时自动停机被阻止；实例 ID 绑定不随数据库迁移。
          content:
            application/json:
              schema:
                type: object
                required: [power_enabled, release_enabled, self_identity_known, self_instance_id, automatic_limit, automatic_window_seconds]
                properties:
                  power_enabled: {type: boolean}
                  release_enabled: {type: boolean}
                  self_identity_known: {type: boolean}
                  self_instance_id: {type: string, nullable: true}
                  automatic_limit: {type: integer, example: 3}
                  automatic_window_seconds: {type: integer, example: 600}
  /protection/rules:
    get:
      tags: [traffic]
      operationId: listQuotaProtectionRules
      summary: 读取额度保护规则
      responses:
        "200":
          description: 本地规则，GET 不查询云端。
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/QuotaProtectionRule"}}
    post:
      tags: [traffic]
      operationId: createQuotaProtectionRule
      summary: 新建额度保护规则
      description: 创建时 revision=0。试运行和禁用电源的判定只保留演练结果，不会稍后重放。确认自身实例字段仅接受当前已知绑定实例 ID，表示显式允许该规则停止面板所在机器。
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/QuotaProtectionRuleInput"}
      responses:
        "201":
          description: 已保存
          content:
            application/json:
              schema: {$ref: "#/components/schemas/QuotaProtectionRule"}
        "422": {description: validation_failed}
  /protection/rules/{rule_id}:
    parameters:
      - {name: rule_id, in: path, required: true, schema: {type: string}}
    put:
      tags: [traffic]
      operationId: updateQuotaProtectionRule
      summary: 替换额度保护规则
      description: revision 必须匹配；变更取消尚未发送的旧电源任务，已发送动作保留证据。编辑后重新判断当前条件。
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/QuotaProtectionRuleInput"}
      responses:
        "200":
          description: 已保存
          content:
            application/json:
              schema: {$ref: "#/components/schemas/QuotaProtectionRule"}
        "409": {description: revision_conflict}
        "422": {description: validation_failed}
    delete:
      tags: [traffic]
      operationId: deleteQuotaProtectionRule
      summary: 停用并删除规则，保留历史
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - {name: revision, in: query, required: true, schema: {type: integer, format: int64}}
      responses:
        "204": {description: 已删除，未发送任务已取消}
        "409": {description: revision_conflict}
  /protection/simulations:
    get:
      tags: [traffic]
      operationId: listQuotaSimulations
      summary: 读取尚未到期的模拟用量
      responses:
        "200":
          description: 模拟不会写入官方观测或真实流量账本。
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/QuotaSimulation"}}
    put:
      tags: [traffic]
      operationId: setQuotaSimulation
      summary: 注入临时模拟用量
      description: 强制只演练；到期自动失效，不能产生真实电源任务。expires_at 必须晚于当前时间且不超过 24 小时。每个账号＋范围（轻量还包含 source_instance_id）只有一份，替换有独立 revision。新建或替换已经过期的模拟可用 revision=0；服务端修订号持续递增。
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/QuotaSimulation"}
      responses:
        "200":
          description: 已保存
          content:
            application/json:
              schema: {$ref: "#/components/schemas/QuotaSimulation"}
        "409": {description: revision_conflict}
        "422": {description: validation_failed}
    delete:
      tags: [traffic]
      operationId: clearQuotaSimulation
      summary: 提前清除模拟用量
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - {name: account_id, in: query, required: true, schema: {type: string}}
        - {name: scope, in: query, required: true, schema: {type: string, enum: [mainland, overseas, swas]}}
        - {name: source_instance_id, in: query, schema: {type: string}}
        - {name: revision, in: query, required: true, schema: {type: integer, format: int64, minimum: 1}}
      responses:
        "204": {description: 已失效，保留修订号}
        "409": {description: revision_conflict}
  /protection/decisions:
    get:
      tags: [traffic]
      operationId: listQuotaDecisions
      summary: 读取持久化保护判定历史
      parameters:
        - {name: rule_id, in: query, schema: {type: string}}
        - {name: before, in: query, schema: {type: integer, format: int64, minimum: 1}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: 倒序历史，按 before 游标继续；演练结果不会改写实际期望状态。
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/QuotaDecision"}}
                  next_before: {type: integer, format: int64, nullable: true}
  /instances/{instance_id}/protection-exemption:
    parameters:
      - {name: instance_id, in: path, required: true, schema: {type: string}}
    put:
      tags: [traffic]
      operationId: setProtectionExemption
      summary: 设置临时额度保护豁免
      description: duration_seconds 为 1–86400 秒，仅影响额度停机，不影响普通手动电源操作。额度停机后手动开机默认自动豁免 3600 秒。
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [duration_seconds]
              properties:
                duration_seconds: {type: integer, minimum: 1, maximum: 86400}
      responses:
        "200": {description: 已保存，返回 instance_id/expires_at}
    delete:
      tags: [traffic]
      operationId: clearProtectionExemption
      summary: 清除临时额度保护豁免
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204": {description: 已清除}
  /traffic/estimation-settings:
    get:
      tags: [traffic]
      operationId: getEstimationSettings
      summary: 读取估算窗口配置
      responses:
        "200":
          description: 本地估算配置；不表示官方延迟已核实。
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EstimationSettings"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    put:
      tags: [traffic]
      operationId: putEstimationSettings
      summary: 保存未核实估算窗口
      description: 修改会使旧缓存失效；默认 3600 秒是可修改的本地假设。真实云执行永远拒绝 unverified 估算。bandwidth_mode_instance_ids 强制这些实例的离线推算使用公网带宽上限，其他实例使用完整最近 10 分钟峰值，历史不足时回退带宽。
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EstimationSettings"}
      responses:
        "200":
          description: 已保存；后台重新计算。
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EstimationSettings"}
        "409": {description: revision_conflict}
        "422": {description: validation_failed}

  /network/ipdb:
    get:
      tags: [network]
      operationId: getOfflineIPDatabaseStatus
      summary: Read offline IP database versions and resources
      description: Local status only; no download or online IP lookup. Default bundled ASN+country datasets, optional downloaded city. DB-IP Lite attribution must be displayed with data-derived results. Memory values describe the process; mapped file bytes are not resident RAM. City mode can exceed the default memory budget.
      responses:
        "200":
          description: Loaded dataset metadata and most recent update attempt
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IPDatabaseStatus"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503": {description: ipdb_unavailable}
  /network/plans/{id}/trace-schedule:
    get:
      tags: [network]
      operationId: getTraceSchedule
      summary: Read a plan's daily trace settings
      description: Default is disabled with revision 0. Active requires both schedule and probe plan enabled. Timezone is the business timezone last applied by the scheduler; next_run_at is null while inactive.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Cached schedule with no network operations
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TraceSchedule"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      tags: [network]
      operationId: saveTraceSchedule
      summary: Configure a daily trace snapshot
      description: Session and CSRF required. Inherit the probe plan source, target, family and method; use the target's TCP port. Enabling requires an enabled plan. New or edited settings and plan edits start at the next daily time; downtime misses schedule one current trace and advance to the next daily time. Pausing, deletion or edits cancel queued old traces; running measurements can finish without stale alerts. No synchronous DNS or packets. Demo is read-only.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TraceScheduleInput"}
      responses:
        "200":
          description: Saved settings
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TraceSchedule"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: network_configuration_changed or plan_disabled}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /network/plans/{id}/trace-snapshots:
    get:
      tags: [network]
      operationId: listTraceSnapshots
      summary: List scheduled trace snapshots and comparisons
      description: At most 31 days by actual scheduling time; inclusive from and exclusive to, no future to. Newest sequence first, cursor bound to plan and range. Includes skipped opportunities; never fabricate missed history. Retired plans retain history. Comparisons and notifications are generated in the background, never by GET. A comparison is with the immediately preceding opportunity, including gaps; manual traces do not enter this sequence.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: from, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: true, schema: {type: string, format: date-time}}
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Stored opportunities and comparisons
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/TraceSnapshot"}}
                  next_cursor: {type: string, nullable: true}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /network/duplex-traces:
    post:
      tags: [network]
      operationId: submitDuplexTrace
      summary: Atomically enqueue traces from both managed endpoints
      description: Session and CSRF required. Select two distinct managed ECS/SWAS instances with current trace-capable agents. Both must have one fresh public address in the selected family. Validate and enqueue both directions in one transaction; either unavailable or full queue leaves neither job. After acceptance each direction executes independently under its own lease. Start times can differ; a later failure never fabricates or replays the other result. The request_key namespace is specific to this endpoint; identical decoded retries return the original pair even after endpoint changes, changed input conflicts. TCP ports are explicit per destination direction. No foreground DNS/cloud/packets. Demo writes return 501.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DuplexTraceSubmission"}
      responses:
        "202":
          description: Both directions accepted atomically
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DuplexTraceAccepted"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: "request_conflict, probe_queue_full, duplex_same_address, or fixed point/target unavailable reason from the manual trace API"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /network/duplex-traces/{id}:
    get:
      tags: [network]
      operationId: getDuplexTrace
      summary: Read both saved trace directions
      description: Frozen managed endpoint names and address observations plus each current trace detail. Queued legs are cancelled if either endpoint's selected address changes or discovery becomes incomplete/stale/unavailable. Already running legs preserve their pinned request and independent result. Agent availability for the other direction is not a reason to replay a completed leg. No cloud, DNS or probe work starts on GET.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Independent forward and reverse state/results
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DuplexTrace"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /network/duplex-traces/{id}/export:
    get:
      tags: [network]
      operationId: exportDuplexTrace
      summary: Export both stored directions as text
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: UTF-8 text with frozen endpoints and both trace exports including available attribution
          content:
            text/plain:
              schema: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /network/traces:
    post:
      tags: [network]
      operationId: submitNetworkTrace
      summary: Enqueue a fixed traceroute
      description: Session and CSRF required. Checks local snapshots only; DNS and packets run in the background. Select exactly one saved target (with revision) or direct public host. Port is explicit, overriding the saved target TCP port. Same request_key and decoded input after defaults return the same job, including after completion; changed input conflicts. Unavailable point/target or unsupported method returns 409 without a job. Running tasks may finish after target edits; queued tasks are cancelled on target edits or changed/incomplete managed address evidence.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TraceSubmission"}
      responses:
        "202":
          description: Accepted without synchronous network work
          content:
            application/json:
              schema:
                type: object
                required: [job_id, trace_id]
                properties:
                  job_id: {type: string}
                  trace_id: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: "network_configuration_changed, request_conflict, probe_queue_full, trace_method_unavailable, or a fixed point/target unavailable reason"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
    get:
      tags: [network]
      operationId: listNetworkTraces
      summary: List stored traceroute summaries
      description: At most 31 days by submission time, inclusive from/exclusive to, no future to. Newest sequence first. Cursor bound to range and filters. Summary only; raw hops are read from detail. Missing results remain null. Deleted targets and disabled accounts retain history. No retention guarantee is implied by query bounds.
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: point_id, in: query, schema: {type: string, maxLength: 128}, description: server or managed source instance ID}
        - {name: target_id, in: query, schema: {type: string, maxLength: 128}, description: Saved target ID}
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Stored summaries, never performs network operations
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/TraceRun"}}
                  next_cursor: {type: string, nullable: true}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /network/traces/{id}:
    get:
      tags: [network]
      operationId: getNetworkTrace
      summary: Read a stored traceroute and raw hops
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Current task status and accepted result; partial results remain incomplete
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TraceDetail"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /network/traces/{id}/export:
    get:
      tags: [network]
      operationId: exportNetworkTrace
      summary: Export stored trace as plain text
      description: Includes state, request, individual responses and any saved enrichment with dataset versions and attribution. Export starts no lookups. Pending traces export their current state with no fabricated hops or metadata.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: UTF-8 text attachment
          content:
            text/plain:
              schema: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /network/targets:
    get:
      tags: [network]
      operationId: listNetworkTargets
      summary: List cached network targets
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Cached rows ordered by ID ascending; live keyset pagination. No cloud, DNS or network probe on GET.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/NetworkTarget"}
                  next_cursor: {type: string, nullable: true}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
    post:
      tags: [network]
      operationId: createNetworkTargets
      summary: Create a network target
      description: Local creation only. revision must be 0. New enabled plans are due immediately; no synchronous probe.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NetworkTargetInput"}
      responses:
        "409": {description: network_configuration_changed}
        "404": {$ref: "#/components/responses/NotFound"}
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NetworkTarget"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /network/targets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    get:
      tags: [network]
      operationId: getNetworkTarget
      summary: Get a network target
      responses:
        "200":
          description: Current cached record
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NetworkTarget"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      tags: [network]
      operationId: updateNetworkTarget
      summary: Replace a network target
      description: Replace configuration with matching revision. Queued runs using old configuration are cancelled; already running measurements may finish. Enabled plans become due now. Optional numeric plan fields reset to documented defaults when omitted.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NetworkTargetInput"}
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NetworkTarget"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: network_configuration_changed}
        "422": {$ref: "#/components/responses/ValidationFailed"}
    delete:
      tags: [network]
      operationId: deleteNetworkTarget
      summary: Retire a network target
      description: Retire with history retained; body revision is required. A target referenced by an undeleted plan returns target_in_use. Queued runs are cancelled; running measurements may finish.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              properties:
                revision: {type: integer, format: int64, minimum: 0}
      responses:
        "204": {description: Retired}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: network_configuration_changed or target_in_use}
  /network/plans:
    get:
      tags: [network]
      operationId: listNetworkPlans
      summary: List cached probe plans
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Cached rows ordered by ID ascending; live keyset pagination. No cloud, DNS or network probe on GET.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/ProbePlan"}
                  next_cursor: {type: string, nullable: true}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
    post:
      tags: [network]
      operationId: createNetworkPlans
      summary: Create a probe plan
      description: Local creation only. revision must be 0. New enabled plans are due immediately; no synchronous probe.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProbePlanInput"}
      responses:
        "409": {description: network_configuration_changed}
        "404": {$ref: "#/components/responses/NotFound"}
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProbePlan"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /network/plans/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    get:
      tags: [network]
      operationId: getNetworkProbePlan
      summary: Get a probe plan
      responses:
        "200":
          description: Current cached record
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProbePlan"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      tags: [network]
      operationId: updateNetworkProbePlan
      summary: Replace a probe plan
      description: Replace configuration with matching revision. Queued runs using old configuration are cancelled; already running measurements may finish. Enabled plans become due now. Optional numeric plan fields reset to documented defaults when omitted.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProbePlanInput"}
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProbePlan"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: network_configuration_changed}
        "422": {$ref: "#/components/responses/ValidationFailed"}
    delete:
      tags: [network]
      operationId: deleteNetworkProbePlan
      summary: Retire a probe plan
      description: Retire with history retained; body revision is required. A target referenced by an undeleted plan returns target_in_use. Queued runs are cancelled; running measurements may finish.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              properties:
                revision: {type: integer, format: int64, minimum: 0}
      responses:
        "204": {description: Retired}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: network_configuration_changed or target_in_use}
  /network/points:
    get:
      tags: [network]
      operationId: listNetworkPoints
      summary: List cached probe point availability
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Server plus managed instances, cached availability only. Agent availability requires fresh traffic heartbeat and a recent authenticated probe poll for the current token; it does not prove raw socket permissions or reachability.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/ProbePoint"}
                  next_cursor: {type: string, nullable: true}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /network/plans/{id}/runs:
    get:
      tags: [network]
      operationId: listProbeRuns
      summary: Read probe runs and skipped attempts
      description: Cached individual measurements and explicit skipped attempts. No backfilled data or zero-fill for missing periods; does not aggregate different resolved addresses. Retired plan history remains readable.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
        - name: from
          in: query
          required: true
          schema: {type: string, format: date-time}
        - name: to
          in: query
          required: true
          schema: {type: string, format: date-time}
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Up to seven days, inclusive from/exclusive to, to no later than now. Newest run sequence first; cursor bound to plan and range.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/ProbeRun"}
                  next_cursor: {type: string, nullable: true}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /setup/status:
    get:
      tags: [setup]
      operationId: getSetupStatus
      summary: 是否已完成首次安装
      security: []
      responses:
        "200":
          description: 安装状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"

  /setup:
    post:
      tags: [setup]
      operationId: completeSetup
      summary: 用初始化 token 设置管理员密码
      description: 成功后原子地建立单管理员及登录会话（Set-Cookie），保存业务时区并消耗初始化凭证。只能成功一次，之后返回 409 `already_initialized`。初始化 token 由 HM_SETUP_TOKEN 或数据目录外的 HM_SETUP_TOKEN_FILE 提供，数据库只存哈希，有效期 24 小时，不写日志；过期后需运维提供新 token 并重启。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201":
          description: 已初始化并登录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "403":
          description: 初始化 token 不正确或已过期（`invalid_setup_token`），或请求来源不符（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

  /session:
    get:
      tags: [session]
      operationId: getSession
      summary: 当前会话
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 已登录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [session]
      operationId: login
      summary: 用管理员密码登录
      description: 单管理员，无用户名；生产环境要求同源 Origin。密码限 12–1024 UTF-8 字节，首次设置状态由 setup/status 查询。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: 密码不正确或密码登录已关闭（`invalid_credentials`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
    delete:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [session]
      operationId: logout
      summary: 退出登录
      responses:
        "204":
          description: 已退出
        "401":
          $ref: "#/components/responses/Unauthorized"

  /session/password:
    patch:
      tags: [session]
      operationId: setPasswordLoginEnabled
      summary: 开关密码登录
      description: >-
        只影响后续密码认证，保留现有会话。重新开启使用原密码，不修改密码。
        关闭前要求至少一个已注册且 RP 与当前 HTTPS public_url 匹配的 Passkey，
        与凭据删除在事务中防止竞态；不满足时返回 409 passkey_required。
        丢失设备后使用 CLI reset-password，重新启用密码、清除所有会话和挑战、保留 Passkey。
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: {type: boolean}
      responses:
        "200":
          description: 已持久保存开关。
          content:
            application/json:
              schema:
                type: object
                required: [password_enabled]
                properties:
                  password_enabled: {type: boolean}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/ValidationFailed"}

  /session/methods:
    get:
      tags: [session]
      operationId: getLoginMethods
      summary: 可用登录方式
      security: []
      responses:
        "200":
          description: 密码开关为持久设置；Passkey 需配置 HTTPS public_url 且已注册当前 RP 的凭据。未初始化时两项均为 false。
          content:
            application/json:
              schema:
                type: object
                required: [password_enabled, passkey_enabled]
                properties:
                  password_enabled: {type: boolean}
                  passkey_enabled: {type: boolean}

  /passkeys:
    get:
      tags: [session]
      operationId: listPasskeys
      summary: 已注册 Passkey
      responses:
        "200":
          description: 最多 20 个；不返回公钥、凭据原文或用户句柄。
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Passkey"}
        "401":
          $ref: "#/components/responses/Unauthorized"

  /passkeys/{passkey_id}:
    parameters:
      - name: passkey_id
        in: path
        required: true
        schema: {type: string}
    delete:
      tags: [session]
      operationId: deletePasskey
      summary: 删除 Passkey
      description: 立即阻止后续使用该凭据完成登录；不删除已建立的会话。关闭密码登录时，不能删除当前 RP 的最后一个可用 Passkey（409 last_passkey）。
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204": {description: 已删除}
        "409": {$ref: "#/components/responses/Conflict"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /passkeys/registration/options:
    post:
      tags: [session]
      operationId: beginPasskeyRegistration
      summary: 开始 Passkey 注册
      description: >-
        生产要求同源 HTTPS。挑战有效期五分钟、单次使用，验证失败也消耗挑战。
        注册绑定当前管理员会话；登录绑定 Secure/HttpOnly/SameSite=Strict 的 hm_passkey cookie，
        同一浏览器再次开始登录会替换绑定 cookie。登录开始与完成各计入已有登录限速。
        注册要求 discoverable credential 和 userVerification=required；不允许跨源 iframe。
        503 passkey_unavailable 表示 HTTPS public_url 未配置；401 invalid_passkey 表示挑战或凭据无效。
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PasskeyRegistrationBegin"}
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PasskeyOptions"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503":
          description: Passkey 不可用或数据库暂不可用。
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}

  /passkeys/registration/finish:
    post:
      tags: [session]
      operationId: finishPasskeyRegistration
      summary: 完成 Passkey 注册
      description: >-
        生产要求同源 HTTPS。挑战有效期五分钟、单次使用，验证失败也消耗挑战。
        注册绑定当前管理员会话；登录绑定 Secure/HttpOnly/SameSite=Strict 的 hm_passkey cookie，
        同一浏览器再次开始登录会替换绑定 cookie。登录开始与完成各计入已有登录限速。
        注册要求 discoverable credential 和 userVerification=required；不允许跨源 iframe。
        503 passkey_unavailable 表示 HTTPS public_url 未配置；401 invalid_passkey 表示挑战或凭据无效。
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PasskeyFinish"}
      responses:
        "201":
          description: 成功
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Passkey"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503":
          description: Passkey 不可用或数据库暂不可用。
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}

  /session/passkey/options:
    post:
      tags: [session]
      operationId: beginPasskeyLogin
      summary: 开始 Passkey 登录
      description: >-
        生产要求同源 HTTPS。挑战有效期五分钟、单次使用，验证失败也消耗挑战。
        注册绑定当前管理员会话；登录绑定 Secure/HttpOnly/SameSite=Strict 的 hm_passkey cookie，
