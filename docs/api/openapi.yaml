        sample_days: {type: integer, minimum: 1, maximum: 7}
        sample_dates: {type: array, items: {type: string, format: date}}
        source: {type: string, enum: [official, agent_estimate, mixed]}
        unverified: {type: boolean}
        baseline_bytes: {type: integer, format: int64}
        baseline_at: {type: string, format: date-time}
        baseline_source: {type: string, enum: [realtime_estimate, official, account_forecasts]}
        baseline_at_assumed: {type: boolean}
        calculated_at: {type: string, format: date-time}
        points: {type: array, items: {$ref: "#/components/schemas/UsagePoint"}}
        reasons: {type: array, items: {type: string}}

